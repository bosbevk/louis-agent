<svg viewBox="-24 -24 928 534" width="928" height="534" role="img" aria-label="louis-agent.evals at a glance" xmlns="http://www.w3.org/2000/svg">
  <title>louis-agent.evals at a glance</title>
  <style>svg {
  --ground: #ffffff; --panel: #f6f7f8; --line: #d9dce0; --text: #15171a; --bright: #070708; --quiet: #5f656d; --chip: #eceef1; --accent: #3b6fc4; --tint: #eef3fc;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  svg { --ground: #070708; --panel: #1b1d21; --line: #2c2f35; --text: #e6e8eb; --bright: #ffffff; --quiet: #9aa0a8; --chip: #15171a; --accent: #7fa8e8; --tint: #141b28; }
}
.ground { fill: var(--ground); }
.box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.label { fill: var(--text); font: 600 12px var(--mono); }
.note { fill: var(--quiet); font: 10px var(--mono); }
.edge { fill: none; stroke: var(--quiet); stroke-width: 1.5; }
.arrow { fill: var(--quiet); }
.dashed { stroke-dasharray: 5 4; }
.group { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.group-label {
  fill: var(--quiet); font: 600 10px var(--mono); letter-spacing: 1px; text-transform: uppercase;
}
.word {
  fill: var(--text); font: 600 10px var(--mono); letter-spacing: 1px; text-transform: uppercase;
  paint-order: stroke; stroke: var(--ground); stroke-width: 5px; stroke-linejoin: round;
}
.caption {
  fill: var(--quiet); font: 600 10.5px var(--mono); letter-spacing: 1.4px; text-transform: uppercase;
}
.icon { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.frame { fill: none; stroke: var(--line); stroke-width: 1; }
.card { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.highlight { fill: var(--tint); stroke: var(--accent); }
.title { fill: var(--text); font: 600 13px var(--mono); }
.chip { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.code { fill: var(--text); font: 11px var(--mono); }
.text { fill: var(--quiet); font: 11px var(--mono); }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
  <rect class="ground" x="-24" y="-24" width="928" height="534" rx="14" />
  <rect class="frame" x="0" y="0" width="880" height="486" rx="14" />
  <path class="edge" d="M 440 126 L 440 146 L 154.7 146 L 154.7 166" marker-end="url(#arrow)" />
  <path class="edge" d="M 440 126 L 440 166" marker-end="url(#arrow)" />
  <path class="edge" d="M 440 126 L 440 146 L 725.3 146 L 725.3 166" marker-end="url(#arrow)" />
  <rect class="card highlight" x="20" y="20" width="840" height="106" rx="10" />
  <g class="icon" transform="translate(430 36) scale(0.8333)">
    <path d="M7 12l5 5l10 -10" />
    <path d="M2 12l5 5m5 -5l5 -5" />
  </g>
  <text class="title" x="304.6" y="81" text-anchor="start">The eval harness</text>
  <rect class="chip" x="445.8" y="65" width="129.6" height="20" rx="5" />
  <text class="code" x="452.8" y="79" text-anchor="start">louis-agent.evals</text>
  <text class="text" x="440" y="105" text-anchor="middle">The one place that knows how an eval runs, so an eval set only says what it asks and how it grades.</text>
  <rect class="card" x="20" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(36 182) scale(0.8333)">
    <path d="M7 8l-4 4l4 4" />
    <path d="M17 8l4 4l-4 4" />
    <path d="M14 4l-4 16" />
  </g>
  <text class="title" x="36" y="227" text-anchor="start">An eval is a class</text>
  <text class="text" x="36" y="251" text-anchor="start">It names its modes, its dataset</text>
  <text class="text" x="36" y="267" text-anchor="start">and its checks. A dataset is a</text>
  <text class="text" x="36" y="283" text-anchor="start">folder of scenarios.</text>
  <rect class="card" x="305.3" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(321.3 182) scale(0.8333)">
    <path d="M8 9h8" />
    <path d="M8 13h6" />
    <path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z" />
  </g>
  <text class="title" x="321.3" y="227" text-anchor="start">Trials</text>
  <text class="text" x="321.3" y="251" text-anchor="start">One conversation per mode, repeat</text>
  <text class="text" x="321.3" y="267" text-anchor="start">and scenario, kept as its</text>
  <text class="text" x="321.3" y="283" text-anchor="start">transcript.</text>
  <rect class="card" x="590.7" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(606.7 182) scale(0.8333)">
    <path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
    <path d="M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
    <path d="M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
    <path d="M4 20h14" />
  </g>
  <text class="title" x="606.7" y="227" text-anchor="start">Checks and metrics</text>
  <text class="text" x="606.7" y="251" text-anchor="start">General checks and a model judge</text>
  <text class="text" x="606.7" y="267" text-anchor="start">grade a trial. Metrics measure it.</text>
  <rect class="card" x="20" y="344" width="412" height="122" rx="10" />
  <g class="icon" transform="translate(36 360) scale(0.8333)">
    <path d="M14 3v4a1 1 0 0 0 1 1h4" />
    <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" />
    <path d="M9 9l1 0" />
    <path d="M9 13l6 0" />
    <path d="M9 17l6 0" />
  </g>
  <text class="title" x="36" y="405" text-anchor="start">One protocol</text>
  <text class="text" x="36" y="429" text-anchor="start">Every event written once, as one JSON line, for the API</text>
  <text class="text" x="36" y="445" text-anchor="start">and the studio to read.</text>
  <rect class="card" x="448" y="344" width="412" height="122" rx="10" />
  <g class="icon" transform="translate(464 360) scale(0.8333)">
    <path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
    <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
  </g>
  <text class="title" x="464" y="405" text-anchor="start">The judge's calibration</text>
  <text class="text" x="464" y="429" text-anchor="start">A label sheet people fill in, and how far the judge</text>
  <text class="text" x="464" y="445" text-anchor="start">agrees with them.</text>
</svg>
