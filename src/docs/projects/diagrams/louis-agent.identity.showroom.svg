  </g>
  <text class="title" x="321.3" y="227" text-anchor="start">A restaurant</text>
  <text class="text" x="321.3" y="251" text-anchor="start">Wheatfield Kitchen: hours, the</text>
  <text class="text" x="321.3" y="267" text-anchor="start">menu and a table booked.</text>
  <rect class="card" x="590.7" y="166" width="269.3" height="122" rx="10" />
  <g class="icon" transform="translate(606.7 182) scale(0.8333)">
    <path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3" />
  </g>
  <text class="title" x="606.7" y="227" text-anchor="start">A law practice</text>
  <text class="text" x="606.7" y="251" text-anchor="start">Koringland Attorneys. Never</text>
  <text class="text" x="606.7" y="267" text-anchor="start">advises, books a consultation.</text>
  <rect class="card" x="20" y="328" width="412" height="122" rx="10" />
