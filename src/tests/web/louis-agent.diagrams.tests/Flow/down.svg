<svg viewBox="-24 -24 406 346" width="406" height="346" role="img" aria-label="A turn, down" xmlns="http://www.w3.org/2000/svg">
  <title>A turn, down</title>
  <style>svg {
  --ground: #ffffff; --panel: #f6f7f8; --line: #d9dce0; --text: #15171a; --bright: #070708; --quiet: #5f656d; --chip: #eceef1; --accent: #3b6fc4; --tint: #eef3fc; --blue-fill: #e3ecfa; --blue-line: #3b78e7; --blue-ink: #1d4ea6; --green-fill: #e2f3e7; --green-line: #2fa354; --green-ink: #17703a; --violet-fill: #ece4f7; --violet-line: #8a55d6; --violet-ink: #5b2fa0; --teal-fill: #def2ef; --teal-line: #22a596; --teal-ink: #116f64; --red-fill: #f9e1e6; --red-line: #e2456c; --red-ink: #a51d42; --amber-fill: #fbeedd; --amber-line: #ef9a2d; --amber-ink: #a35d0c;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  svg { --ground: #070708; --panel: #1b1d21; --line: #2c2f35; --text: #e6e8eb; --bright: #ffffff; --quiet: #9aa0a8; --chip: #15171a; --accent: #7fa8e8; --tint: #141b28; --blue-fill: #15213a; --blue-line: #6b9cf0; --blue-ink: #b9d0fa; --green-fill: #13281b; --green-line: #4cc173; --green-ink: #b6ebc6; --violet-fill: #221a35; --violet-line: #a985ec; --violet-ink: #d9c9f8; --teal-fill: #0f2a27; --teal-line: #3cc4b3; --teal-ink: #b3ece4; --red-fill: #2e141c; --red-line: #ef6f8f; --red-ink: #f8c2d0; --amber-fill: #2c2010; --amber-line: #f2ad52; --amber-ink: #f8dcb4; }
}
.ground { fill: var(--ground); }
.box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.label { fill: var(--text); font: 600 12px var(--mono); }
.note { fill: var(--quiet); font: 10px var(--mono); }
.edge { fill: none; stroke: var(--quiet); stroke-width: 1.5; }
.arrow { fill: var(--quiet); }
.dashed { stroke-dasharray: 5 4; }
.group { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.group-label {
  fill: var(--quiet); font: 600 10px var(--mono); letter-spacing: 1px; text-transform: uppercase;
}
.word { fill: var(--text); font: 500 10px var(--mono); }
.word-chip { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
.caption {
  fill: var(--quiet); font: 600 10.5px var(--mono); letter-spacing: 1.4px; text-transform: uppercase;
}
.icon { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.frame { fill: none; stroke: var(--line); stroke-width: 1; }
.card { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.highlight { fill: var(--tint); stroke: var(--accent); }
.title { fill: var(--text); font: 600 13px var(--mono); }
.chip { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.code { fill: var(--text); font: 11px var(--mono); }
.text { fill: var(--quiet); font: 11px var(--mono); }
.badge { fill: var(--quiet); }
.badge-icon {
  fill: none; stroke: var(--panel); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.box.tone-blue { fill: var(--blue-fill); stroke: var(--blue-line); stroke-width: 1.5; }
.badge.tone-blue, .arrow.tone-blue { fill: var(--blue-line); }
.label.tone-blue, .word.tone-blue { fill: var(--blue-ink); }
.edge.tone-blue, .word-chip.tone-blue { stroke: var(--blue-line); }
.box.tone-green { fill: var(--green-fill); stroke: var(--green-line); stroke-width: 1.5; }
.badge.tone-green, .arrow.tone-green { fill: var(--green-line); }
.label.tone-green, .word.tone-green { fill: var(--green-ink); }
.edge.tone-green, .word-chip.tone-green { stroke: var(--green-line); }
.box.tone-violet { fill: var(--violet-fill); stroke: var(--violet-line); stroke-width: 1.5; }
.badge.tone-violet, .arrow.tone-violet { fill: var(--violet-line); }
.label.tone-violet, .word.tone-violet { fill: var(--violet-ink); }
.edge.tone-violet, .word-chip.tone-violet { stroke: var(--violet-line); }
.box.tone-teal { fill: var(--teal-fill); stroke: var(--teal-line); stroke-width: 1.5; }
.badge.tone-teal, .arrow.tone-teal { fill: var(--teal-line); }
.label.tone-teal, .word.tone-teal { fill: var(--teal-ink); }
.edge.tone-teal, .word-chip.tone-teal { stroke: var(--teal-line); }
.box.tone-red { fill: var(--red-fill); stroke: var(--red-line); stroke-width: 1.5; }
.badge.tone-red, .arrow.tone-red { fill: var(--red-line); }
.label.tone-red, .word.tone-red { fill: var(--red-ink); }
.edge.tone-red, .word-chip.tone-red { stroke: var(--red-line); }
.box.tone-amber { fill: var(--amber-fill); stroke: var(--amber-line); stroke-width: 1.5; }
.badge.tone-amber, .arrow.tone-amber { fill: var(--amber-line); }
.label.tone-amber, .word.tone-amber { fill: var(--amber-ink); }
.edge.tone-amber, .word-chip.tone-amber { stroke: var(--amber-line); }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
