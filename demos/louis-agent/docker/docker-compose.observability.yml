# The dashboard every host sends its logs and traces to (F52): the standalone Aspire dashboard, its own stack, started
# once beside the others. The code-review stack and Puls send to it at host.docker.internal:4317, and Rider's runs at
# localhost:4317 when config/.env sets OTEL_EXPORTER_OTLP_ENDPOINT. It keeps everything in memory: a restart forgets it.
#   Start: docker compose -f demos/louis-agent/docker/docker-compose.observability.yml up -d
#   Then open http://127.0.0.1:18888. No --env-file: it reads none of our settings.
name: louis-agent-observability

services:
  dashboard:
    image: mcr.microsoft.com/aspire/dashboard@sha256:e4220c55fa3c3e40ad2d733ef07973392299b420e9bde6924e8f6a1e71ff01a8   # 13.6.2
    container_name: louis_agent_dashboard
    environment:
      # No login: the ports are on this PC's loopback only.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      # The dashboard's page.
      - "127.0.0.1:18888:18888"
      # OTLP over gRPC on the port every exporter sends to by default; the dashboard takes it on 18889.
      - "127.0.0.1:4317:18889"
