<!DOCTYPE html>
<html lang="af" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16191b" />
    <title>Puls</title>
    <!-- The link card (SiteLinkCardTests): what Facebook, LinkedIn, Slack and the rest show for a link here. A crawler
         runs no script, so it is written here, never by a page; the picture and the address are absolute, on HTTPS. -->
    <meta name="description" content="Elke vraag op pad na 'n antwoord. Puls stuur jou vraag na 'n spesialis met net die gereedskap wat dit nodig het, en jy sien hoe dit terugkom: die stappe, die bronne en die koste." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Puls" />
    <meta property="og:locale" content="af_ZA" />
    <meta property="og:title" content="Puls · elke vraag op pad na 'n antwoord" />
    <meta property="og:description" content="Jou vraag is die versteuring. Puls stuur dit uit na 'n spesialis met net die gereedskap wat dit nodig het, en jy sien hoe dit terugkom: die stappe, die bronne en die koste." />
    <meta property="og:url" content="https://mypuls.co.za/" />
    <meta property="og:image" content="https://mypuls.co.za/icon-192.png" />
    <meta property="og:image:width" content="192" />
    <meta property="og:image:height" content="192" />
    <meta name="twitter:card" content="summary" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="brand/puls-mark.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <!-- Montserrat for text, JetBrains Mono for code; both fall back to the system fonts if they can't load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
    <!-- Bootstrap 5.3 for the responsive offcanvas sidebar and breakpoints; loaded before app.css so Puls's styles win. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- The components' own styles (CL58), bundled by the build from every X.razor.scss, after app.css so they win. -->
    <link rel="stylesheet" href="louis-agent.puls.styles.css" />
    <script src="_content/louis-agent.web/js/first-paint.js"></script>
</head>

<body>
    <div id="app">
        <!-- The start screen (F24): the mark beats while the runtime's files load; the count is Blazor's own progress
             (it sets --blazor-load-percentage-text on <html> as each file arrives), so it is real, not a timer. -->
        <div class="loading" role="status" aria-live="polite">
            <img class="loading-mark" src="brand/puls-icon-tile.svg" alt="" width="72" height="72" />
            <img src="brand/puls-logo-white.svg" alt="Puls" width="96" />
            <b class="loading-pct" aria-hidden="true"></b>
        </div>
    </div>

    <div id="blazor-error-ui">
        Iets het skeefgeloop.
        <a href="." class="reload">Herlaai</a>
        <span class="dismiss">×</span>
    </div>
    <!-- Syntax highlighting for code blocks in answers: pinned version with integrity hashes; its colours come from app.css. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"
            integrity="sha512-VSPLUv/n1Bmn+4zoxBNwpuFAO3//79I0Aax/qHDx24R47vylPcc9PrHDCqlePwHnh3joiM7/YTQhcXyQAAxvPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
