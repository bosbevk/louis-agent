  <text class="notes" x="38" y="551">
    <tspan class="note-rest">group with no network of ours, so Azure bills no load balancer; they read the shared registry, vault and share</tspan>
  </text>
  <text class="notes" x="38" y="568">
    <tspan class="note-rest">across in rg-puls-za. The old environment, its load balancer and IP and puls-vnet are deleted at the end. The</tspan>
  </text>
  <text class="notes" x="38" y="585">
    <tspan class="note-rest">number in brackets is the step.</tspan>
