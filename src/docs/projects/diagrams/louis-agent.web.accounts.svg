  <text class="title" x="293.1" y="81" text-anchor="start">Account pages</text>
  <rect class="chip" x="409.7" y="65" width="177.2" height="20" rx="5" />
  <text class="code" x="416.7" y="79" text-anchor="start">louis-agent.web.accounts</text>
  <text class="text" x="440" y="105" text-anchor="middle">What the browser does for accounts. A site without accounts ships none of it.</text>
  <rect class="card" x="20" y="166" width="269.3" height="138" rx="10" />
