inegar, sugar and dry roasted whole and ground spices.","name":"Cape Malay Pickled Fish (Ingelegde Vis) - Tantalise My Taste Buds","@id":"https://www.tantalisemytastebuds.com/cape-malay-pickled-fish/#richSnippet","isPartOf":{"@id":"https://www.tantalisemytastebuds.com/cape-malay-pickled-fish/#webpage"},"image":{"@id":"https://www.tantalisemytastebuds.com/wp-content/uploads/2018/03/Cape-Malay-Pickled-Fish-4355.jpg"},"inLanguage":"en-US","mainEntityOfPage":{"@id":"https://www.tantalisemytastebuds.com/cape-malay-pickled-fish/#webpage"}},{"@type":"Recipe","name":"Cape Malay Pickled Fish","author":{"@type":"Person","name":"Razena Schroeder","url":"https://www.tantalisemytastebuds.com"},"description":"Cape Malay Pickled Fish is pan-fried lightly spiced white fish steeped in a sweet and sour marinade of crunchy onions, vinegar, sugar and dry roasted whole and ground spices.","datePublished":"2026-03-26T10:00:00+00:00","image":["https://www.tantalisemytastebuds.com/wp-content/uploads/2018/03/Cape-Malay-Pickled-Fish-4355.jpg","https://www.tantalisemytastebuds.com/wp-content/uploads/2018/03/Cape-Malay-Pickled-Fish-4355-500x500.jpg","https://www.tantalisemytastebuds.com/wp-content/uploads/2018/03/Cape-Malay-Pickled-Fish-4355-500x375.jpg","https://www.tantalisemytastebuds.com/wp-content/uploads/2018/03/Cape-Malay-Pickled-Fish-4355-480x270.jpg"],"recipeYield":["6"],"prepTime":"PT30M","cookTime":"PT30M","totalTime":"PT60M","recipeIngredient":["500 grams firm fleshed white fish fillets, skin on (cut into 6.5 cm squares, approximately 2 1/2 inch squares)","5 ml sea salt (use more as needed)","80 ml fish masala (or pickled fish masala, use more as needed)","80 ml sunflower or vegetable oil (use more as needed)","400 grams onion rings, 5mm slices (approximately 2 large brown onions)","15 ml sea salt","1500 ml water (approximately 6 cups)","500 ml white grape vinegar (approximately 2 cups)","250 ml water (approximately 1 cups)","160 ml fine granulated sugar (approximately 2/3 cup; adjust to personal taste)","5 ml sea salt (adjust to personal taste)","3 bay leaves","7.5 ml cumin seeds (dry roasted)","7.5 ml coriander seeds (dry roasted)","5 ml fennel seeds (dry roasted)","6 peppercorns (dry roasted)","6 cloves (dry roasted)","6 all spice berries (dry roasted)","2.5 ml turmeric powder","7.5 ml fish masala","Coriander microshoots","Fennel blossoms"],"recipeInstructions":[{"@type":"HowToSection","name":"Masala fish","itemListElement":[{"@type":"HowToStep","text":"Cut the fish into 6.5 cm (2.5 inch) squares and wipe dry with kitchen towel. You should have 12 pieces.","name":"Cut the fish into 6.5 cm (2.5 inch) squares and wipe dry with kitchen towel. You should have 12 pieces.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-0-0"},{"@type":"HowToStep","text":"Place a sheet of foil or parchment on a baking tray and arrange the fish pieces skin side up then sprinkle over half the salt and fish masala spice.","name":"Place a sheet of foil or parchment on a baking tray and arrange the fish pieces skin side up then sprinkle over half the salt and fish masala spice.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-0-1"},{"@type":"HowToStep","text":"Flip the fish pieces over and sprinkle the other side with the remaining salt and fish masala.","name":"Flip the fish pieces over and sprinkle the other side with the remaining salt and fish masala.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-0-2"},{"@type":"HowToStep","text":"Cover the fish with cling wrap and refrigerate until ready to fry when the pickling mix goes onto the stove.","name":"Cover the fish with cling wrap and refrigerate until ready to fry when the pickling mix goes onto the stove.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-0-3"},{"@type":"HowToStep","text":"Heat a frying pan on medium-high and&nbsp;add enough oil to&nbsp;cover the base. Fry the fish on both sides until cooked through.","name":"Heat a frying pan on medium-high and&nbsp;add enough oil to&nbsp;cover the base. Fry the fish on both sides until cooked through.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-0-4"},{"@type":"HowToStep","text":"Put the fried fish on to a tray lined with foil.","name":"Put the fried fish on to a tray lined with foil.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-0-5"}]},{"@type":"HowToSection","name":"Blanching the onions","itemListElement":[{"@type":"HowToStep","text":"Slice the onions into 5 mm wide rings and sprinkle over 15 ml sea salt.","name":"Slice the onions into 5 mm wide rings and sprinkle over 15 ml sea salt.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-1-0"},{"@type":"HowToStep","text":"Rub the salt into the onions and let sit until required.","name":"Rub the salt into the onions and let sit until required.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-1-1"},{"@type":"HowToStep","text":"Bring the 1500 ml water to the boil in a medium sized pot and&nbsp;blanch half&nbsp;of the onion rings for&nbsp;10 seconds then remove&nbsp;to a colander.&nbsp;Repeat with the rest of the onion rings.","name":"Bring the 1500 ml water to the boil in a medium sized pot and&nbsp;blanch half&nbsp;of the onion rings for&nbsp;10 seconds then remove&nbsp;to a colander.&nbsp;Repeat with the rest of the onion rings.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-1-2"},{"@type":"HowToStep","text":"Discard&nbsp;the onion water and rinse the pot then put it back on the stove.","name":"Discard&nbsp;the onion water and rinse the pot then put it back on the stove.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-1-3"}]},{"@type":"HowToSection","name":"Pickling marinade","itemListElement":[{"@type":"HowToStep","text":"To the pot on the stove add the vinegar, water,&nbsp;sugar and spices and allow to&nbsp;simmer for 10 minutes to allow the flavors of the spices to permeate the pickling marinade","name":"To the pot on the stove add the vinegar, water,&nbsp;sugar and spices and allow to&nbsp;simmer for 10 minutes to allow the flavors of the spices to permeate the pickling marinade","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-2-0"},{"@type":"HowToStep","text":"Remove from the heat and add the onion rings to the pickling marinade.","name":"Remove from the heat and add the onion rings to the pickling marinade.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-2-1"}]},{"@type":"HowToSection","name":"Layering the Cape Malay pickled fish","itemListElement":[{"@type":"HowToStep","text":"Lay half the fried fish into a glass casserole dish then cover with half the onion rings.","name":"Lay half the fried fish into a glass casserole dish then cover with half the onion rings.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-3-0"},{"@type":"HowToStep","text":"Repeat with the rest of the fish and cover with the remaining onion rings. Pour over all the juices and oil left on the foil.","name":"Repeat with the rest of the fish and cover with the remaining onion rings. Pour over all the juices and oil left on the foil.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-3-1"},{"@type":"HowToStep","text":"Pour over the hot pickling marinade and allow to cool at room temperature then cover with a lid or plastic wrap and refrigerate.","name":"Pour over the hot pickling marinade and allow to cool at room temperature then cover with a lid or plastic wrap and refrigerate.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-3-2"},{"@type":"HowToStep","text":"Allow the marinade to infuse the pickled fish for at least 6 hours or overnight, before eating.","name":"Allow the marinade to infuse the pickled fish for at least 6 hours or overnight, before eating.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-3-3"},{"@type":"HowToStep","text":"Decorate with fennel blossoms and coriander microshoots, if using.","name":"Decorate with fennel blossoms and coriander microshoots, if using.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-3-4"},{"@type":"HowToStep","text":"Serve with buttered hot cross buns or crusty bread.","name":"Serve with buttered hot cross buns or crusty bread.","url":"https://www.tantalisemytastebuds.com/recipe/wprm-cape-malay-pickled-fish/#wprm-recipe-7337-step-3-5"}]}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.88","ratingCount":"16","reviewCount":"12"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Gteat recipe!","author":{"@type":"Person","name":"Abraham de Klerk"},"datePublished":"2024-07-11"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I live in the US and was raised on pickled fish as my parents were born in SA. I am craving it and your recipe looks very close to my mom\u2019s recipe! We are Indian and often do not add sweetness to dinner dishes so I\u2019ll have to experiment. Thank you!","author":{"@type":"Person","name":"Asha"},"datePublished":"2020-05-03"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"How do I reduce the salty taste once I have completed the recipe thanks","author":{"@type":"Person","name":"Chris Gale"},"datePublish
