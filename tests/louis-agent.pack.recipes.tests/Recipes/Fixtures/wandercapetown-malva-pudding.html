1b8462526bca?s=96&d=mm&r=g","caption":"Katja Mamacos"},"description":"Hi, I'm Katja! I'm a writer and editor, and I created Wander Cape Town to be a resource on everything in and around my home city, from activities and attractions to info on our natural environment and initiatives.","sameAs":["https://wandercapetown.com"]},{"@type":"Recipe","name":"Malva Pudding","author":{"@id":"https://wandercapetown.com/#/schema/person/aed9d46a5887679b02817ac97f850bf0"},"description":"This malva pudding recipe is simple and delicious, an absolute classic. To be enjoyed with ice cream, whipped cream or warm custard.","datePublished":"2021-01-27T19:54:24+00:00","image":["https://wandercapetown.com/wp-content/uploads/2021/01/malva-pudding-recipe.jpg","https://wandercapetown.com/wp-content/uploads/2021/01/malva-pudding-recipe-500x500.jpg","https://wandercapetown.com/wp-content/uploads/2021/01/malva-pudding-recipe-500x375.jpg","https://wandercapetown.com/wp-content/uploads/2021/01/malva-pudding-recipe-480x270.jpg"],"recipeYield":["8"],"prepTime":"PT30M","cookTime":"PT45M","totalTime":"PT75M","recipeIngredient":["1 tbsp butter (room temperature)","1 cup brown sugar","4 tbsp apricot jam","1  large egg","1 cup milk","2 tbsp vinegar","2 tsp vanilla essence","1 cup all-purpose flour","1 tsp baking soda","½ tsp salt","2 tbsp butter","125 ml cream","4 tbsp brown sugar","2 tbsp water"],"recipeInstructions":[{"@type":"HowToSection","name":"Pudding","itemListElement":[{"@type":"HowToStep","text":"Preheat the oven to 180℃ (350℉). Ovens are temperamental, so if you know yours needs a bit more (or less) of a push, feel free to adjust.","name":"Preheat the oven to 180℃ (350℉). Ovens are temperamental, so if you know yours needs a bit more (or less) of a push, feel free to adjust.","url":"https://wandercapetown.com/recipe/malva-pudding/#wprm-recipe-243-step-0-0"},{"@type":"HowToStep","text":"In a large mixing bowl add your first 4 ingredients - butter, sugar, jam and egg. Beat until it lightens and gets a bit fluffier. If you only have a fork, the fluffy part isn’t make-or-break.","name":"In a large mixing bowl add your first 4 ingredients - butter, sugar, jam and egg. Beat until it lightens and gets a bit fluffier. If you only have a fork, the fluffy part isn’t make-or-break.","url":"https://wandercapetown.com/recipe/malva-pudding/#wprm-recipe-243-step-0-1"},{"@type":"HowToStep","text":"In a large measuring cup or a bowl, add milk, then vinegar and vanilla essence. Whisk lightly.","name":"In a large measuring cup or a bowl, add milk, then vinegar and vanilla essence. Whisk lightly.","url":"https://wandercapetown.com/recipe/malva-pudding/#wprm-recipe-243-step-0-2"},{"@type":"HowToStep","text":"In another measuring cup/bowl, add bicarb to flour and give it a quick stir.","name":"In another measuring cup/bowl, add bicarb to flour and give it a quick stir.","url":"https://wandercapetown.com/recipe/malva-pudding/#wprm-recipe-243-step-0-3"},{"@type":"HowToStep","text":"Alternating between the milk mixture and the flour, add to the large mixing bowl and mix well as you go along.","name":"Alternating between the milk mixture and the flour, add to the large mixing bowl and mix well as you go along.","url":"https://wandercapetown.com/recipe/malva-pudding/#wprm-recipe-243-step-0-4"},{"@type":"HowToStep","text":"Pour into a lightly greased oven-proof dish (ours was 30x15cm, but it could definitely have been a bit smaller).","name":"Pour into a lightly greased oven-proof dish (ours was 30x15cm, but it could definitely have been a bit smaller).","url":"https://wandercapetown.com/recipe/malva-pudding/#wprm-recipe-243-step-0-5"},{"@type":"HowToStep","text":"Bake for 45 minutes, or until a knife comes out with spongy crumbs stuck to it (it’s not likely to come out clean) rather than uncooked batter. The pudding will stay in its mold and rest for a bit once the sauce is poured over.","name":"Bake for 45 minutes, or until a knife comes out with spongy crumbs stuck to it (it’s not likely to come out clean) rather than uncooked batter. The pudding will stay in its mold and rest for a bit once the sauce is poured over.","url":"https://wandercapetown.com/recipe/malva-pudding/#wprm-recipe-243-step-0-6"}]},{"@type":"HowToSection","name":"Sauce","itemListElement":[{"@type":"HowToStep","text":"Add all sauce ingredients together in a pot and bring to a boil.","name":"Add all sauce ingredients together in a pot and bring to a boil.","url":"https://wandercapetown.com/recipe/malva-pudding/#wprm-recipe-243-step-1-0"},{"@type":"HowToStep","text":"Let it simmer, stirring constantly, for 3 minutes. This time will give the sauce a richer, deeper taste.","name":"Let it simmer, stirring constantly, for 3 minutes. This time will give the sauce a richer, deeper taste.","url":"https://wandercapetown.com/recipe/malva-pudding/#wprm-recipe-243-step-1-1"},{"@type":"HowToStep","text":"Stab the pudding a few times with a fork to help the sauce sink in so that it doesn’t pool at the sides and soak in only there. Then pour the sauce over slowly, being sure you’re not leaving any part dry.","name":"Stab the pudding a few times with a fork to help the sauce sink in so that it doesn’t pool at the sides and soak in only there. Then pour the sauce over slowly, being sure you’re not leaving any part dry.","url":"https://wandercapetown.com/recipe/malva-pudding/#wprm-recipe-243-step-1-2"}]}],"recipeCategory":["Dessert"],"recipeCuisine":["South African"],"@id":"https://wandercapetown.com/recipe/malva-pudding/#recipe","isPartOf":{"@id":"https://wandercapetown.com/recipe/malva-pudding/#article"},"mainEntityOfPage":"https://wandercapetown.com/recipe/malva-pudding/"}]}</script>
