<svg viewBox="-24 -24 928 372" width="928" height="372" role="img" aria-label="louis-agent.accounts at a glance" xmlns="http://www.w3.org/2000/svg">
  <title>louis-agent.accounts at a glance</title>
  <style>svg {
  --ground: #ffffff; --panel: #f6f7f8; --line: #d9dce0; --text: #15171a; --bright: #070708; --quiet: #5f656d; --chip: #eceef1; --accent: #3b6fc4; --tint: #eef3fc;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  svg { --ground: #070708; --panel: #1b1d21; --line: #2c2f35; --text: #e6e8eb; --bright: #ffffff; --quiet: #9aa0a8; --chip: #15171a; --accent: #7fa8e8; --tint: #141b28; }
}
.ground { fill: var(--ground); }
.box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.label { fill: var(--text); font: 600 12px var(--mono); }
.note { fill: var(--quiet); font: 10px var(--mono); }
.edge { fill: none; stroke: var(--quiet); stroke-width: 1.5; }
.arrow { fill: var(--quiet); }
.word {
  fill: var(--text); font: 600 10px var(--mono); letter-spacing: 1px; text-transform: uppercase;
  paint-order: stroke; stroke: var(--ground); stroke-width: 5px; stroke-linejoin: round;
}
.caption {
  fill: var(--quiet); font: 600 10.5px var(--mono); letter-spacing: 1.4px; text-transform: uppercase;
}
.icon { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.frame { fill: none; stroke: var(--line); stroke-width: 1; }
.card { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.highlight { fill: var(--tint); stroke: var(--accent); }
.title { fill: var(--text); font: 600 13px var(--mono); }
.chip { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.code { fill: var(--text); font: 11px var(--mono); }
.text { fill: var(--quiet); font: 11px var(--mono); }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
  <rect class="ground" x="-24" y="-24" width="928" height="372" rx="14" />
  <rect class="frame" x="0" y="0" width="880" height="324" rx="14" />
  <path class="edge" d="M 440 126 L 440 146 L 154.7 146 L 154.7 166" marker-end="url(#arrow)" />
  <path class="edge" d="M 440 126 L 440 166" marker-end="url(#arrow)" />
  <path class="edge" d="M 440 126 L 440 146 L 725.3 146 L 725.3 166" marker-end="url(#arrow)" />
  <rect class="card highlight" x="20" y="20" width="840" height="106" rx="10" />
  <g class="icon" transform="translate(430 36) scale(0.8333)">
    <path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
    <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
  </g>
  <text class="title" x="327.2" y="81" text-anchor="start">Accounts</text>
  <rect class="chip" x="402.8" y="65" width="150" height="20" rx="5" />
  <text class="code" x="409.8" y="79" text-anchor="start">louis-agent.accounts</text>
  <text class="text" x="440" y="105" text-anchor="middle">Sign-in, registration and a profile, with a tenant on every account from the first day.</text>
  <rect class="card" x="20" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(36 182) scale(0.8333)">
    <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
    <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
  </g>
  <text class="title" x="36" y="227" text-anchor="start">ASP.NET Core Identity</text>
  <text class="text" x="36" y="251" text-anchor="start">Microsoft's own routes under</text>
  <text class="text" x="36" y="267" text-anchor="start">/account. A person signs in once</text>
  <text class="text" x="36" y="283" text-anchor="start">the mail's link confirms them.</text>
  <rect class="card" x="305.3" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(321.3 182) scale(0.8333)">
    <path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" />
    <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
  </g>
  <text class="title" x="321.3" y="227" text-anchor="start">Our routes beside them</text>
  <text class="text" x="321.3" y="251" text-anchor="start">Who you are, your display name,</text>
  <text class="text" x="321.3" y="267" text-anchor="start">sign-out, and deleting your own</text>
  <text class="text" x="321.3" y="283" text-anchor="start">account.</text>
  <rect class="card" x="590.7" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(606.7 182) scale(0.8333)">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
    <path d="M3.6 9h16.8" />
    <path d="M3.6 15h16.8" />
    <path d="M11.5 3a17 17 0 0 0 0 18" />
    <path d="M12.5 3a17 17 0 0 1 0 18" />
  </g>
  <text class="title" x="606.7" y="227" text-anchor="start">The tenant</text>
  <text class="text" x="606.7" y="251" text-anchor="start">Read from the host, so a business</text>
  <text class="text" x="606.7" y="267" text-anchor="start">site is another row, not another</text>
  <text class="text" x="606.7" y="283" text-anchor="start">deployment.</text>
</svg>
