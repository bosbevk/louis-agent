# louis-agent-site: the framework's site on Azure Container Apps (rg-louis-agent-za), in the environment the Bicep
# build made (demos/louis-agent/config/azure/main.bicep), deployed with deploy.ps1 (F61.4; the how-to is README.md here).
#   deploy.ps1 update -Tag 2026-11-08-1200 -Revision v002     # fills TAG, REVISION and ENVIRONMENT_ID, then creates or updates
# One container: the image demos/louis-agent/docker/images/Dockerfile.site builds, static pages on 8080 with /health.
# It spends nothing and keeps nothing, so it has no secret, no store and no key.
name: louis-agent-site
resourceGroup: rg-louis-agent-za
location: South Africa North
type: Microsoft.App/containerApps
properties:
  environmentId: ENVIRONMENT_ID
  workloadProfileName: Consumption
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8080
      transport: Auto
      allowInsecure: false
      traffic:
        - latestRevision: true
          weight: 100
    registries:
      - server: acrlouisagentza.azurecr.io
        identity: system-environment
  template:
    revisionSuffix: 'REVISION'
    containers:
      - name: louis-agent-site
        image: acrlouisagentza.azurecr.io/louis-agent-site:TAG
        resources:
          cpu: 0.25
          memory: 0.5Gi
        probes:
          - type: Startup
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          - type: Liveness
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
    scale:
      # Scales to nothing when nobody reads it; the first visitor waits for a cold start of a few seconds.
      minReplicas: 0
      maxReplicas: 2
