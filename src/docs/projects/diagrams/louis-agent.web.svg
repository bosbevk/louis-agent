    <g class="icon" transform="translate(430 36) scale(0.8333)">
      <path d="M4 4m0 1a1 1 0 0 1 1 -1h14a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-14a1 1 0 0 1 -1 -1z" />
      <path d="M4 8h16" />
      <path d="M8 4v4" />
    </g>
    <text class="title" x="299.1" y="81" text-anchor="start">The framework's web</text>
    <rect class="chip" x="464.9" y="65" width="116" height="20" rx="5" />
    <text class="code" x="471.9" y="79" text-anchor="start">louis-agent.web</text>
    <text class="text" x="440" y="105" text-anchor="middle">What every site shares. A site brings only its words, brand, colours and its own pages.</text>
    <rect class="card" x="20" y="166" width="269.3" height="138" rx="10" />
    <g class="icon" transform="translate(36 182) scale(0.8333)">
      <path d="M8 9h8" />
      <path d="M8 13h6" />
      <path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z" />
    </g>
    <text class="title" x="36" y="227" text-anchor="start">The chat's frame</text>
    <text class="text" x="36" y="251" text-anchor="start">The whole chat: its sidebar,</text>
    <text class="text" x="36" y="267" text-anchor="start">messages, message box and search,</text>
    <text class="text" x="36" y="283" text-anchor="start">a turn's life included.</text>
    <rect class="card" x="305.3" y="166" width="269.3" height="138" rx="10" />
    <g class="icon" transform="translate(321.3 182) scale(0.8333)">
      <path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" />
      <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
    </g>
    <text class="title" x="321.3" y="227" text-anchor="start">The admin's frame</text>
    <text class="text" x="321.3" y="251" text-anchor="start">The sidebar, the phone's top bar</text>
    <text class="text" x="321.3" y="267" text-anchor="start">and the content column, with a</text>
    <text class="text" x="321.3" y="283" text-anchor="start">pack's screens in it.</text>
    <rect class="card" x="590.7" y="166" width="269.3" height="138" rx="10" />
    <g class="icon" transform="translate(606.7 182) scale(0.8333)">
      <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
      <path d="M3.6 9h16.8" />
      <path d="M3.6 15h16.8" />
      <path d="M11.5 3a17 17 0 0 0 0 18" />
      <path d="M12.5 3a17 17 0 0 1 0 18" />
    </g>
    <text class="title" x="606.7" y="227" text-anchor="start">The site's parts</text>
    <text class="text" x="606.7" y="251" text-anchor="start">The shell, the tiles, the diagrams</text>
    <text class="text" x="606.7" y="267" text-anchor="start">and the showroom every site builds</text>
    <text class="text" x="606.7" y="283" text-anchor="start">its pages on.</text>
    <rect class="card" x="20" y="344" width="412" height="122" rx="10" />
    <g class="icon" transform="translate(36 360) scale(0.8333)">
      <path d="M7 8l-4 4l4 4" />
      <path d="M17 8l4 4l-4 4" />
      <path d="M14 4l-4 16" />
    </g>
    <text class="title" x="36" y="405" text-anchor="start">Styles and scripts</text>
    <text class="text" x="36" y="429" text-anchor="start">A component's styles and its script module sit beside</text>
    <text class="text" x="36" y="445" text-anchor="start">it.</text>
    <rect class="card" x="448" y="344" width="412" height="122" rx="10" />
    <g class="icon" transform="translate(464 360) scale(0.8333)">
      <path d="M12 3l8 4.5l0 9l-8 4.5l-8 -4.5l0 -9l8 -4.5" />
