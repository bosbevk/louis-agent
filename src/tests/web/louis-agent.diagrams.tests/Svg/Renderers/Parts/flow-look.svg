.pic-fill.tone-green { fill: var(--green-line); }
.pic-ink.tone-green { fill: var(--green-ink); }
.pic-edge.tone-violet { stroke: var(--violet-line); }
.pic-panel.tone-violet { --pic-tone: var(--violet-fill); }
.pic-tint.tone-violet { fill: var(--violet-fill); }
.pic-fill.tone-violet { fill: var(--violet-line); }
.pic-ink.tone-violet { fill: var(--violet-ink); }
.pic-edge.tone-teal { stroke: var(--teal-line); }
.pic-panel.tone-teal { --pic-tone: var(--teal-fill); }
.pic-tint.tone-teal { fill: var(--teal-fill); }
.pic-fill.tone-teal { fill: var(--teal-line); }
.pic-ink.tone-teal { fill: var(--teal-ink); }
.pic-edge.tone-red { stroke: var(--red-line); }
.pic-panel.tone-red { --pic-tone: var(--red-fill); }
.pic-tint.tone-red { fill: var(--red-fill); }
.pic-fill.tone-red { fill: var(--red-line); }
.pic-ink.tone-red { fill: var(--red-ink); }
.pic-edge.tone-amber { stroke: var(--amber-line); }
.pic-panel.tone-amber { --pic-tone: var(--amber-fill); }
.pic-tint.tone-amber { fill: var(--amber-fill); }
.pic-fill.tone-amber { fill: var(--amber-line); }
.pic-ink.tone-amber { fill: var(--amber-ink); }
.pic-panel {
  fill: color-mix(in srgb, var(--pic-tone, var(--pic-depth)) 42%, var(--pic-depth));
  stroke-width: 1; stroke-opacity: .5; filter: drop-shadow(0 8px 9px var(--pic-lift));
}
.pic-panel.depth-0 { --pic-depth: var(--pic-0); }
.pic-panel.depth-1 { --pic-depth: var(--pic-1); }
.pic-panel.depth-2 { --pic-depth: var(--pic-2); }
.pic-panel.depth-3 { --pic-depth: var(--pic-3); }
.pic-panel.depth-4 { --pic-depth: var(--pic-4); }
.pic-panel.depth-5 { --pic-depth: var(--pic-5); }
.pic-sheen { fill: none; stroke: var(--pic-sheen); stroke-width: 1; stroke-linecap: round; }
.pic-swatch { stroke-width: 1; }
.pic-title { fill: var(--text); font: 700 21px var(--pic-sans); letter-spacing: -.2px; }
.pic-group {
