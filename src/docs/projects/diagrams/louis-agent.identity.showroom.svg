  <text class="code" x="432.5" y="79" text-anchor="start">louis-agent.identity.showroom</text>
  <text class="text" x="440" y="105" text-anchor="middle">Three made-up businesses' agents, each answering a customer and passing a booking on.</text>
  <rect class="card" x="20" y="166" width="269.3" height="122" rx="10" />
  <g class="icon" transform="translate(36 182) scale(0.8333)">
