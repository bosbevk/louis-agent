# Build and test every pull request and every merge to main, so a regression is caught before a review, not only locally.
# The development guide's "Finishing a step", in two steps: dotnet build, then the unit tests, then (F18 step 7.6) the integration tests, which leave their process and live in their own projects.
# already runs them on Linux in its containers, so the runner is Ubuntu. No model, no network, no secrets: the tests
# use FakeChatClient and StubHandler, and skip themselves when git, pip or the network is missing. One service: a
# throwaway MongoDB, so the benchmark store's contract runs against the real store too (F31), not only in memory.
name: CI

# One run per change: a pull request's every push, and main once a pull request merges. A push to a branch alone runs
# nothing (open a draft pull request to get CI); with both events on every branch, each push ran twice and the two runs
# shared one concurrency group, so one cancelled the other, and the formatting check, which ran only on the push, was
# the one most often cancelled.
on:
  push:
    branches: [ main ]
  pull_request:

# The job only reads the repository: the token gets no write rights, whatever the repository's default is.
permissions:
  contents: read

# A newer push to the same pull request cancels its older run; main's runs never cancel, so every merge is checked.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        # 7.0, not 8: MongoDB 8.0+ won't start on Linux 6.19 and newer (SERVER-121912), the kernel some runners now have;
        # the store's contract uses nothing 7.0 lacks. Back to 8 once MongoDB ships the fix.
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: ci
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      sql:
        # The accounts database's contract (F61.1): a throwaway SQL Server with a throwaway password, so no secret.
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci-password-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci-password-1 -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # The git tests commit in a temporary repository; the runner has no identity of its own.
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@localhost
      # The Mongo store's contract tests (F31); a throwaway server with a throwaway user, so no secret.
      BENCHMARKS_MONGO_URL: mongodb://ci:ci@localhost:27017/?authSource=admin
      # The accounts database's contract (F61.1), on the service above.
      ACCOUNTS_SQL_TEST_URL: Server=127.0.0.1,1433;User Id=sa;Password=Ci-password-1;TrustServerCertificate=true
    steps:
      - uses: actions/checkout@v7
        with:
          # The formatting check compares a push with the commit before it, so it needs the history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build louis-agent-solution.sln

      - name: Formatting
        # src/docs/CLAUDE.md "Formatting": the .editorconfig's rules, checked only on the C# files the change's commits touched
        # (merges left out, so files that came in from main aren't counted); untouched files keep their old layout until
        # a step changes them, and a file only moved (a rename with no change, R100) counts as untouched (CL28 moved
        # 900+). A pull request compares with its base, a push to main with the commit before it; a force push has no
        # earlier commit to compare with.
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "No earlier commit to compare with; skipped."; exit 0; fi
          files=$(git log --no-merges -M --name-status --format= --diff-filter=AMR "$BEFORE..HEAD" -- '*.cs' | awk '$1 != "R100" {print $NF}' | sort -u)
          if [ -z "$files" ]; then echo "No C# files changed."; exit 0; fi
          dotnet format louis-agent-solution.sln --verify-no-changes --no-restore --include $files

      - name: Unit tests
        # The unit tests start no process and need no tool (F18 step 7.6): every integration test carries the Integration mark and lives in a `.integration-tests` project, so the filter leaves them out.
        # One .trx per test project, named by the logger, so they don't overwrite each other. The results go outside the
        # checkout: a folder at the top that isn't a solution group fails SolutionLayoutTests (ADR 0074).
        run: dotnet test louis-agent-solution.sln --no-build --filter "Category!=Integration" --logger trx --results-directory "$RUNNER_TEMP/TestResults/unit"

      - name: Integration tests
        # The tests that leave their process: real git, bash, interpreters, dotnet child processes and Mongo. A tool this image has that a test cannot find fails the test here, not skips it
        # (INTEGRATION_REQUIRED); only the Puls stack's browser and SearXNG tests still skip, since this image has no such stack.
        env:
          INTEGRATION_REQUIRED: 1
        run: dotnet test louis-agent-solution.sln --no-build --filter "Category=Integration" --logger trx --results-directory "$RUNNER_TEMP/TestResults/integration"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults
