  <text class="title" x="321.3" y="227" text-anchor="start">FindShopsNear</text>
  <text class="text" x="321.3" y="251" text-anchor="start">The supermarkets in a town, for</text>
  <text class="text" x="321.3" y="267" text-anchor="start">someone who named no shop.</text>
