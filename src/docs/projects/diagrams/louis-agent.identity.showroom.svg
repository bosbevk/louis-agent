  <text class="title" x="36" y="389" text-anchor="start">The leads pack</text>
  <text class="text" x="36" y="413" text-anchor="start">Passes a booking on, after the customer's yes.</text>
  <rect class="card" x="448" y="328" width="412" height="122" rx="10" />
  <g class="icon" transform="translate(464 344) scale(0.8333)">
