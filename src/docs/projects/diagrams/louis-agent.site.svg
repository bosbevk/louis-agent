    <path d="M3.6 15h16.8" />
    <path d="M11.5 3a17 17 0 0 0 0 18" />
    <path d="M12.5 3a17 17 0 0 1 0 18" />
  </g>
  <text class="title" x="279.3" y="81" text-anchor="start">The framework's website</text>
  <rect class="chip" x="477.9" y="65" width="122.8" height="20" rx="5" />
  <text class="code" x="484.9" y="79" text-anchor="start">louis-agent.site</text>
  <text class="text" x="440" y="105" text-anchor="middle">What louis-agent is and what Louis sells, built on the framework's web as a customer's site is.</text>
  <rect class="card" x="20" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(36 182) scale(0.8333)">
    <path d="M4 4m0 1a1 1 0 0 1 1 -1h14a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-14a1 1 0 0 1 -1 -1z" />
    <path d="M4 8h16" />
    <path d="M8 4v4" />
  </g>
  <text class="title" x="36" y="227" text-anchor="start">The pages</text>
  <text class="text" x="36" y="251" text-anchor="start">Offer first, the framework as the</text>
  <text class="text" x="36" y="267" text-anchor="start">proof, every place on a page with</text>
  <text class="text" x="36" y="283" text-anchor="start">its own address.</text>
  <rect class="card" x="305.3" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(321.3 182) scale(0.8333)">
    <path d="M8 9h8" />
    <path d="M8 13h6" />
    <path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z" />
  </g>
  <text class="title" x="321.3" y="227" text-anchor="start">The guide</text>
  <text class="text" x="321.3" y="251" text-anchor="start">The chat in the corner, answering</text>
  <text class="text" x="321.3" y="267" text-anchor="start">from the docs and nothing else.</text>
  <rect class="card" x="590.7" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(606.7 182) scale(0.8333)">
    <path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
    <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
  </g>
  <text class="title" x="606.7" y="227" text-anchor="start">The showroom</text>
  <text class="text" x="606.7" y="251" text-anchor="start">Made-up businesses' agents,</text>
  <text class="text" x="606.7" y="267" text-anchor="start">recorded once, then live to try.</text>
  <rect class="card" x="20" y="344" width="412" height="122" rx="10" />
  <g class="icon" transform="translate(36 360) scale(0.8333)">
    <path d="M3 4m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z" />
    <path d="M3 12m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z" />
    <path d="M7 8l0 .01" />
    <path d="M7 16l0 .01" />
  </g>
  <text class="title" x="36" y="405" text-anchor="start">Its own host</text>
  <text class="text" x="36" y="429" text-anchor="start">A few lines: the pages as HTML and the guide's API,</text>
  <text class="text" x="36" y="445" text-anchor="start">nothing else.</text>
  <rect class="card" x="448" y="344" width="412" height="122" rx="10" />
  <g class="icon" transform="translate(464 360) scale(0.8333)">
    <path d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878" />
  </g>
  <text class="title" x="464" y="405" text-anchor="start">Its image</text>
  <text class="text" x="464" y="429" text-anchor="start">The host, the docs the guide reads and the price</text>
  <text class="text" x="464" y="445" text-anchor="start">tables, run in Azure.</text>
</svg>
