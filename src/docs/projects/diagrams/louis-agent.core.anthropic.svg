  <text class="title" x="315" y="81" text-anchor="start">Claude</text>
  <rect class="chip" x="374.2" y="65" width="190.8" height="20" rx="5" />
  <text class="code" x="381.2" y="79" text-anchor="start">louis-agent.core.anthropic</text>
  <text class="text" x="440" y="105" text-anchor="middle">The provider a program hands in when its agent may talk to Claude.</text>
  <rect class="card" x="20" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(36 182) scale(0.8333)">
    <path d="M8 9h8" />
    <path d="M8 13h6" />
    <path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z" />
  </g>
  <text class="title" x="36" y="227" text-anchor="start">The client</text>
  <text class="text" x="36" y="251" text-anchor="start">Built from the key and endpoint</text>
  <text class="text" x="36" y="267" text-anchor="start">the settings give, with a thinking</text>
  <text class="text" x="36" y="283" text-anchor="start">budget for older models.</text>
  <rect class="card" x="305.3" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(321.3 182) scale(0.8333)">
    <path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
    <path d="M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
    <path d="M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
    <path d="M4 20h14" />
  </g>
  <text class="title" x="321.3" y="227" text-anchor="start">The usage mapper</text>
  <text class="text" x="321.3" y="251" text-anchor="start">Reads Anthropic's cache writes,</text>
  <text class="text" x="321.3" y="267" text-anchor="start">which it reports outside the</text>
  <text class="text" x="321.3" y="283" text-anchor="start">standard fields.</text>
  <rect class="card" x="590.7" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(606.7 182) scale(0.8333)">
    <path d="M12 6m-8 0a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" />
    <path d="M4 6v6a8 3 0 0 0 16 0v-6" />
    <path d="M4 12v6a8 3 0 0 0 16 0v-6" />
  </g>
  <text class="title" x="606.7" y="227" text-anchor="start">Prompt caching</text>
  <text class="text" x="606.7" y="251" text-anchor="start">The marker at the end of the</text>
  <text class="text" x="606.7" y="267" text-anchor="start">system prompt and the one the API</text>
  <text class="text" x="606.7" y="283" text-anchor="start">moves forward.</text>
