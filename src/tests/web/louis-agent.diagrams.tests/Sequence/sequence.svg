  <text class="word tone-green" x="188.5" y="468" text-anchor="middle">SSE: text, tool calls, cost</text>
  <rect class="word-chip tone-green" x="309" y="472" width="16" height="16" rx="8" />
  <text class="word tone-green" x="317" y="483.5" text-anchor="middle">6</text>
