# puls-app: Puls on Azure Container Apps (rg-puls-za), in the environment puls-env the Bicep build made
# (demos/puls/config/azure/main.bicep), deployed with deploy.ps1 (F61.4; the how-to is README.md here).
#   deploy.ps1 update -Tag 2026-11-08-1200 -Revision v021     # fills TAG, REVISION, VM_IP, ENVIRONMENT_ID and the providers
# One container: the app, on the same image as demos/puls/docker/docker-compose.puls.yml builds. Its web and its
# stores are on the VM puls-services at its private address (VM_IP, read from the deployment's outputs), its accounts
# on Azure SQL. No secret value lives in this file or on the app: every value is in the vault puls-keys (deploy.ps1
# secrets puts it there), the app's secrets are references to it by URL, read with the identity the Bicep build
# made, and deploy.ps1 update writes the `secrets:` block from the names the vault holds. Behind its key: the web app
# signs in, and the gate takes a signed-in person or AGENT_API_KEY (F61.2), so no lock and no AGENT_AUTH=off.
name: puls-app
resourceGroup: rg-puls-za
location: South Africa North
type: Microsoft.App/containerApps
identity:
  type: UserAssigned
  userAssignedIdentities:
    'APP_IDENTITY_ID': {}
properties:
  environmentId: ENVIRONMENT_ID
  workloadProfileName: Consumption
  configuration:
    # SECRETS
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8080
      transport: Auto
      allowInsecure: false
      traffic:
        - latestRevision: true
          weight: 100
    registries:
      - server: acrpulsza.azurecr.io
        identity: system-environment
  template:
    revisionSuffix: 'REVISION'
    containers:
      # The app. Its settings mirror the puls service in demos/puls/docker/docker-compose.puls.yml, less what only this PC needs
      # (the git line-ending config for a Windows checkout, a skills folder); what differs is where its web and its
      # stores are: the VM's private address.
      - name: puls-app
        image: acrpulsza.azurecr.io/louis-agent-puls:TAG
        env:
          - name: IDENTITIES
            value: puls
          # Its name in Application Insights (F52): the collector's address and protocol come from the environment's
          # OpenTelemetry agent (the Bicep build), never from here.
          - name: OTEL_SERVICE_NAME
            value: puls
          - name: HOST_TIME_ZONE
            value: Africa/Johannesburg
          - name: HOST_CULTURE
            value: en-ZA
          - name: WORKSPACE_ROOT
            value: /workspace
          - name: LOG_DIRECTORY
            value: /logs
          - name: PRICES_FILE
            value: /workspace/config/prices.json
          - name: RATES_FILE
            value: /workspace/config/rates.json
          - name: USAGE_IN_CHAT
            value: 'true'
          - name: LLM_PROVIDER
            value: anthropic
          - name: LLM_MODEL
            value: claude-haiku-5-5
          - name: ANTHROPIC_API_KEY
            secretRef: anthropic-api-key
          # Peers and roles as in the compose: one instance, its specialists on itself.
          - name: AGENT_PEERS
            value: puls=http://127.0.0.1:8080
          - name: ROLES_ENABLED
            value: puls/voice-af,puls/voice-en,puls-cook,puls-minion-web-price-lookup,puls-minion-find-recipe
          # Puls shows a specialist's report as it is and ends its turn there, instead of retyping it.
          - name: SHOW_SPECIALIST_REPORTS
            value: 'true'
          # The key every /v1 call needs unless a signed-in person makes it (F61.2); the peer call above sends it too.
          - name: AGENT_API_KEY
            secretRef: agent-api-key
          - name: ADMIN_API_KEY
            secretRef: admin-api-key
          # The web it reads: SearXNG and the headless browser on the VM, at its private address.
          - name: WEB_SEARCH_PROVIDER
            value: searxng
          - name: SEARXNG_URL
            value: http://VM_IP:8080
          - name: BROWSER_URL
            value: http://VM_IP:9222
          # What the browser tells the sites it reads for a user (FX21): who reads, where to learn more, and why; never a person.
          - name: BROWSER_USER_AGENT
            value: "Puls/1.0 (+https://github.com/bosbevk/louis-agent/blob/main/demos/puls/docs/SITE_OWNERS.md; reads a page on a user's behalf)"
          # The recipe sites the recipes toolset may search: every site in the table (F35.2, Louis's pick E2), as the compose sets it.
          - name: RECIPE_SOURCES
            value: "*"
          # The benchmark store, the shop prices and the recipe library: the VM's Mongo, one server, three databases;
          # the URL carries the password, so it is a secret (deploy.ps1 secrets builds it at the VM's address).
          - name: EVALS_MONGO_URL
            secretRef: mongo-url
          - name: EVALS_MONGO_DATABASE
            value: puls_benchmarks
          - name: SHOP_PRICES_MONGO_URL
            secretRef: mongo-url
          - name: RECIPES_MONGO_URL
            secretRef: mongo-url
          - name: RECIPE_LIBRARY_URL
            value: http://127.0.0.1:8080/
          # The accounts (F61): Azure SQL's free-offer database, every account on this host Puls's, the cookie on
          # the domain. The connection string is a secret deploy.ps1 secrets builds from the deployment's outputs.
          - name: ACCOUNTS_SQL_URL
            secretRef: accounts-sql-url
          - name: ACCOUNTS_TENANT
            value: puls
          - name: ACCOUNTS_COOKIE_DOMAIN
            value: mypuls.co.za
          # The sign-in providers (F61.3): deploy.ps1 update puts one pair of lines here for each provider whose two
          # secrets are set on the app (auth-google-client-id and -secret, and so on), so a provider with no keys
          # names no secret the app lacks and stays off.
          # PROVIDERS
        resources:
          cpu: 1
          memory: 2Gi
          ephemeralStorage: 4Gi
        # The share puls-app-workspace (storage puls-app-vol on the environment, from the Bicep build): config/ with
        # the price tables at the paths above, logs/ for the run files and the usage ledger, data/ for the pages an eval run saves.
        volumeMounts:
          - volumeName: puls-app-vol
            mountPath: /workspace
          - volumeName: puls-app-vol
            subPath: logs
            mountPath: /logs
          - volumeName: puls-app-vol
            subPath: data
            mountPath: /data
        probes:
          - type: Startup
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 120
            timeoutSeconds: 3
          - type: Readiness
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 48
            timeoutSeconds: 5
          - type: Liveness
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
    scale:
      # Nothing runs while nobody is on it (Louis, 2026-11-07: "I do not need the replica"): the first visitor
      # waits for a cold start of some seconds, and the month costs what is used.
      minReplicas: 0
      maxReplicas: 1
    volumes:
      - name: puls-app-vol
        storageType: AzureFile
        storageName: puls-app-vol
