<!DOCTYPE html>
<html lang="en" data-theme="flat" data-style="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>louis-agent · the C# AI agent framework</title>
    <!-- The link card: what a chat or a social site shows for a link here. A crawler runs no script, so it is written
         here, never by a page; the address is absolute, on HTTPS. -->
    <meta name="description" content="louis-agent is an AI agent framework in C#, on Microsoft.Extensions.AI, that runs on your own hardware." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="louis-agent" />
    <meta property="og:title" content="louis-agent · the C# AI agent framework" />
    <meta property="og:description" content="An AI agent framework in C#, on Microsoft.Extensions.AI, that runs on your own hardware." />
    <meta property="og:url" content="https://framework.louis-agent.dev/" />
    <!-- louis-agent's card, "Build agents, not infrastructure", from louis-agent.dev until this site has its own. -->
    <meta property="og:image" content="https://louis-agent.dev/social-card.png" />
    <meta property="og:image:alt" content="The name louis-agent with a glass ball as its o, &quot;The website that answers.&quot; under it, and the address louis-agent.dev." />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta name="twitter:card" content="summary_large_image" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Google Search shows only a bitmap icon, never an SVG (FX217): without these a grey globe stands by every result. -->
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Geist for text and code, the framework's own; both fall back to the system fonts if they can't load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;600&display=swap" />
    <!-- Bootstrap 5.3 for the responsive offcanvas sidebar and breakpoints; loaded before app.css so our styles win. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- The components' own styles, bundled by the build from every X.razor.scss, after app.css so they win. -->
    <link rel="stylesheet" href="LouisAgent.SiteFramework.styles.css" />
    <script src="_content/LouisAgent.Web/js/first-paint.js"></script>
</head>

<body>
    <div id="app">
        <div class="loading">BOOTING LOUIS AGENT<span class="cursor"></span></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
