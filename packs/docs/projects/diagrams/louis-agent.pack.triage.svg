    <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" />
    <path d="M9 9l1 0" />
    <path d="M9 13l6 0" />
    <path d="M9 17l6 0" />
  </g>
  <text class="title" x="36" y="227" text-anchor="start">The error feed</text>
  <text class="text" x="36" y="251" text-anchor="start">The errors not handled yet, and</text>
  <text class="text" x="36" y="267" text-anchor="start">the mark that one was, kept beside</text>
  <text class="text" x="36" y="283" text-anchor="start">the log.</text>
  <rect class="card" x="305.3" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(321.3 182) scale(0.8333)">
