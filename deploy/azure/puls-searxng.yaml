# puls-searxng: the SearXNG puls-app searches with, as its own Container App (CL19 pulled this from Azure, where F32 had
# made it by hand). The same settings file as the local stack, docker/searxng/settings.yml, uploaded to the share
# searxng-config (deploy.ps1 searxng-settings); its secret is the app's secret searxng-secret (deploy.ps1 secrets
# -App puls-searxng, from config/.env.searxng). Development and benchmarks only (ADR 0023): the sold endpoint keeps a
# licensed search API. The image is SearXNG's own, copied into the registry; it is not ours to rebuild, so no TAG here.
#   deploy.ps1 update -App puls-searxng -Revision v004
name: puls-searxng
resourceGroup: rg-puls-za
location: South Africa North
type: Microsoft.App/containerApps
properties:
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8080
      transport: Auto
      allowInsecure: false
    registries:
      - server: acrpulsza.azurecr.io
        identity: system-environment
  template:
    revisionSuffix: 'REVISION'
    containers:
      - name: puls-searxng
        image: acrpulsza.azurecr.io/searxng/searxng:791806
        env:
          - name: SEARXNG_SETTINGS_PATH
            value: /etc/searxng/settings.yml
          - name: SEARXNG_BASE_URL
            value: http://puls-searxng:8080/
          - name: BIND_ADDRESS
            value: 0.0.0.0:8080
          - name: USE_ONLY_HTTPS
            value: 'false'
          - name: SEARXNG_SECRET
            secretRef: searxng-secret
        resources:
          cpu: 1
          memory: 2Gi
          ephemeralStorage: 4Gi
        volumeMounts:
          - volumeName: searxngvol
            mountPath: /etc/searxng
    scale:
      minReplicas: 1
      maxReplicas: 1
    volumes:
      - name: searxngvol
        storageType: AzureFile
        storageName: searxngvol
