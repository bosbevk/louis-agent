# The framework's public site on louis-agent.dev (F58), served from this PC through a Cloudflare Tunnel. Its own
# container group, apart from the dev stacks, so `down` on one never touches the other. Nothing here can spend money
# or change data: the tunnel reaches only `site`, on a network no agent, API or database joins.
#
#   docker compose -f demos/louis-agent/docker/docker-compose.public.yml --env-file demos/louis-agent/config/.env.secrets up -d --build
#
# The secrets file is read only to fill SITE_TUNNEL_TOKEN below; no other key reaches a container.
name: louis-agent-production

services:
  site:
    build:
      context: ../../..
      dockerfile: demos/louis-agent/docker/images/Dockerfile.site
    image: louis-agent-site:latest
    restart: unless-stopped
    # Localhost only, to check the site on this PC before it goes out (http://localhost:5060).
    ports:
      - "127.0.0.1:${SITE_PORT:-5060}:8080"
    networks:
      - public

  cloudflared:
    # Dials out to Cloudflare, so no port opens on the router. Cloudflare's dashboard maps louis-agent.dev and
    # www.louis-agent.dev to http://site:8080 (the tunnel's public hostnames).
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      # cloudflared reads its token from this variable, so it never shows on a command line.
      TUNNEL_TOKEN: ${SITE_TUNNEL_TOKEN:?set SITE_TUNNEL_TOKEN in demos/louis-agent/config/.env.secrets}
    depends_on:
      site:
        condition: service_healthy
    networks:
      - public

networks:
  public: {}
