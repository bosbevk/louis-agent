<g><path class="panel" d="M 291 80 L 386 128 L 291 176 L 196 128 Z"/><text class="name" x="291" y="132.5" text-anchor="middle">A decision?</text></g>
<g class="t-amber"><path class="panel" d="M 430 96 L 592 96 L 574 160 L 412 160 Z"/><rect class="badge" x="434" y="113" width="30" height="30" rx="8"/><g class="icon" transform="translate(440 119) scale(.75)"><path d="M12 6m-8 0a8 3 0 1 0 16 0a8 3 0 1 0 -16 0"/><path d="M4 6v6a8 3 0 0 0 16 0v-6"/><path d="M4 12v6a8 3 0 0 0 16 0v-6"/></g><text class="name" x="474" y="132.5">Data</text></g>
<g class="t-blue"><rect class="panel" x="618" y="96" width="162" height="64" rx="32"/><path class="sheen" d="M 650 97 H 748"/><rect class="badge" x="640" y="113" width="30" height="30" rx="8"/><g class="icon" transform="translate(646 119) scale(.75)"><path d="M8 9h8"/><path d="M8 13h6"/><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z"/></g><text class="name" x="680" y="132.5">A start</text></g>
<text class="word" x="85" y="204" text-anchor="middle">no shape, or "box"</text>
<text class="word" x="291" y="204" text-anchor="middle">"decision"</text>
<text class="word" x="502" y="204" text-anchor="middle">"data"</text>
<text class="word" x="699" y="204" text-anchor="middle">"terminal"</text></svg>
