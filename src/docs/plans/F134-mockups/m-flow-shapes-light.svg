<g class="t-blue"><rect class="panel shape" x="618" y="96" width="162" height="64" rx="32"/><path class="sheen" d="M 650 97 H 748"/><rect class="marker" x="641" y="117" width="4" height="22" rx="2"/><rect class="badge" x="652" y="113" width="30" height="30" rx="8"/><g class="icon" transform="translate(658 119) scale(.75)"><path d="M8 9h8"/><path d="M8 13h6"/><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z"/></g><text class="name" x="692" y="133">A start</text></g>
