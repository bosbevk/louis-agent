.ground { fill: var(--ground); }
.dots { fill: none; stroke: var(--dot); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 0 22; }
.title { fill: var(--text); font: 700 21px var(--sans); letter-spacing: -.2px; }
.sub { fill: var(--quiet); font: 600 10px var(--mono); letter-spacing: 1.4px; text-transform: uppercase; }
svg { --tf: var(--d2); --tl: var(--quiet); --ti: var(--text); }
.panel { fill: color-mix(in srgb, var(--tf) 42%, var(--d2)); stroke: var(--tl); stroke-width: 1;
  stroke-opacity: .5; stroke-linejoin: round; filter: drop-shadow(0 8px 9px var(--lift)); }
.group { fill: var(--d1); stroke: var(--line); stroke-width: 1; filter: drop-shadow(0 8px 9px var(--lift)); }
.sheen { fill: none; stroke: var(--sheen); stroke-width: 1; stroke-linecap: round; }
.name { fill: var(--text); font: 600 13.5px var(--sans); }
.badge { fill: color-mix(in srgb, var(--tl) 22%, var(--d2)); stroke: var(--tl); stroke-width: 1; stroke-opacity: .6; }
.icon { fill: none; stroke: var(--tl); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.line { fill: none; stroke: var(--tl); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.march { fill: none; stroke: var(--march); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1 13;
  animation: march 1.1s linear infinite; }
.head { fill: var(--tl); }
.port { fill: var(--ground); stroke: var(--tl); stroke-width: 1.25; }
.word-chip { fill: var(--ground); stroke: var(--tl); stroke-width: 1; stroke-opacity: .6; }
.word { fill: var(--ti); font: 500 10px var(--mono); }
.key { fill: var(--quiet); font: 11.5px var(--sans); }
.notebar { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.note-icon { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.notes { fill: var(--quiet); font: 12px var(--sans); }
.notes .b { fill: var(--text); font-weight: 700; }
@keyframes march { to { stroke-dashoffset: -14; } }
@media (prefers-reduced-motion: reduce) { .march { display: none; } }
.t-blue { --tf: var(--blue-fill); --tl: var(--blue-line); --ti: var(--blue-ink); }
.t-green { --tf: var(--green-fill); --tl: var(--green-line); --ti: var(--green-ink); }
.t-violet { --tf: var(--violet-fill); --tl: var(--violet-line); --ti: var(--violet-ink); }
.t-teal { --tf: var(--teal-fill); --tl: var(--teal-line); --ti: var(--teal-ink); }
.t-red { --tf: var(--red-fill); --tl: var(--red-line); --ti: var(--red-ink); }
.t-amber { --tf: var(--amber-fill); --tl: var(--amber-line); --ti: var(--amber-ink); }</style><rect class="ground" x="-24" y="-24" width="1761" height="704" rx="16"/><path class="dots" d=""/>
