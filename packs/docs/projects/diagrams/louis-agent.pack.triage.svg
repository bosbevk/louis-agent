    <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
  </g>
  <text class="title" x="36" y="405" text-anchor="start">A person, and a run read back</text>
  <text class="text" x="36" y="429" text-anchor="start">A case raised to people with the run so far, and any</text>
  <text class="text" x="36" y="445" text-anchor="start">run read back a line a step.</text>
  <rect class="card" x="448" y="344" width="412" height="122" rx="10" />
  <g class="icon" transform="translate(464 360) scale(0.8333)">
