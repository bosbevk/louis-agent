" rx="14" fill="url(#sitepackglass)" stroke="#ffffff" stroke-opacity=".10"/><rect x="672.0" y="283.5" width="228.0" height="1.6" fill="url(#sitepackedge)"/><rect x="662.0" y="302" width="34" height="34" rx="10" fill="#8f7dff" fill-opacity=".16"/><g transform="translate(670.0 310.0) scale(0.7500)" fill="none" stroke="#cfc8ff" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12l5 5l10 -10"/><path d="M2 12l5 5m5 -5l5 -5"/></g><text x="708.0" y="325.0" text-anchor="start" style="fill:#f3f4f8;font:600 15px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">Offer</text><text x="662.0" y="360.0" text-anchor="start" style="fill:#9aa3b5;font:12px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">Two to four choices as cards; the click</text><text x="662.0" y="378.0" text-anchor="start" style="fill:#9aa3b5;font:12px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">comes back as the visitor's message.</text><rect x="32.0" y="468" width="896.0" height="96" rx="14" fill="url(#sitepackglass)" stroke="#ffffff" stroke-opacity=".10"/><rect x="60.0" y="467.5" width="840.0" height="1.6" fill="url(#sitepackedge)"/><rect x="50.0" y="486" width="34" height="34" rx="10" fill="#8f7dff" fill-opacity=".16"/><g transform="translate(58.0 494.0) scale(0.7500)" fill="none" stroke="#cfc8ff" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M3.6 9h16.8"/><path d="M3.6 15h16.8"/><path d="M11.5 3a17 17 0 0 0 0 18"/><path d="M12.5 3a17 17 0 0 1 0 18"/></g><text x="96.0" y="509.0" text-anchor="start" style="fill:#f3f4f8;font:600 15px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">The widget acts</text><text x="50.0" y="544.0" text-anchor="start" style="fill:#9aa3b5;font:12px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">It moves