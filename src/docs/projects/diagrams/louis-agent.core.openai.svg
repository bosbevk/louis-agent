<svg viewBox="-24 -24 928 356" width="928" height="356" role="img" aria-label="louis-agent.core.openai at a glance" xmlns="http://www.w3.org/2000/svg">
  <title>louis-agent.core.openai at a glance</title>
  <style>svg {
  --ground: #ffffff; --panel: #f6f7f8; --line: #d9dce0; --text: #15171a; --bright: #070708; --quiet: #5f656d; --chip: #eceef1; --accent: #3b6fc4; --tint: #eef3fc; --blue-fill: #e3ecfa; --blue-line: #3b78e7; --blue-ink: #1d4ea6; --green-fill: #e2f3e7; --green-line: #2fa354; --green-ink: #17703a; --violet-fill: #ece4f7; --violet-line: #8a55d6; --violet-ink: #5b2fa0; --teal-fill: #def2ef; --teal-line: #22a596; --teal-ink: #116f64; --red-fill: #f9e1e6; --red-line: #e2456c; --red-ink: #a51d42; --amber-fill: #fbeedd; --amber-line: #ef9a2d; --amber-ink: #a35d0c;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  svg { --ground: #070708; --panel: #1b1d21; --line: #2c2f35; --text: #e6e8eb; --bright: #ffffff; --quiet: #9aa0a8; --chip: #15171a; --accent: #7fa8e8; --tint: #141b28; --blue-fill: #15213a; --blue-line: #6b9cf0; --blue-ink: #b9d0fa; --green-fill: #13281b; --green-line: #4cc173; --green-ink: #b6ebc6; --violet-fill: #221a35; --violet-line: #a985ec; --violet-ink: #d9c9f8; --teal-fill: #0f2a27; --teal-line: #3cc4b3; --teal-ink: #b3ece4; --red-fill: #2e141c; --red-line: #ef6f8f; --red-ink: #f8c2d0; --amber-fill: #2c2010; --amber-line: #f2ad52; --amber-ink: #f8dcb4; }
}
.ground { fill: var(--ground); }
.box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.label { fill: var(--text); font: 600 12px var(--mono); }
.note { fill: var(--quiet); font: 10px var(--mono); }
.edge { fill: none; stroke: var(--quiet); stroke-width: 1.5; }
.arrow { fill: var(--quiet); }
.dashed { stroke-dasharray: 5 4; }
.group { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.group-label {
  fill: var(--quiet); font: 600 10px var(--mono); letter-spacing: 1px; text-transform: uppercase;
}
.word {
  fill: var(--text); font: 600 10px var(--mono); letter-spacing: 1px; text-transform: uppercase;
  paint-order: stroke; stroke: var(--ground); stroke-width: 5px; stroke-linejoin: round;
}
.caption {
  fill: var(--quiet); font: 600 10.5px var(--mono); letter-spacing: 1.4px; text-transform: uppercase;
}
.icon { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.frame { fill: none; stroke: var(--line); stroke-width: 1; }
.card { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.highlight { fill: var(--tint); stroke: var(--accent); }
.title { fill: var(--text); font: 600 13px var(--mono); }
.chip { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.code { fill: var(--text); font: 11px var(--mono); }
.text { fill: var(--quiet); font: 11px var(--mono); }
.badge { fill: var(--quiet); }
.badge-icon {
  fill: none; stroke: var(--panel); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.box.tone-blue { fill: var(--blue-fill); stroke: var(--blue-line); stroke-width: 1.5; }
.badge.tone-blue { fill: var(--blue-line); }
.label.tone-blue { fill: var(--blue-ink); }
.box.tone-green { fill: var(--green-fill); stroke: var(--green-line); stroke-width: 1.5; }
.badge.tone-green { fill: var(--green-line); }
.label.tone-green { fill: var(--green-ink); }
.box.tone-violet { fill: var(--violet-fill); stroke: var(--violet-line); stroke-width: 1.5; }
.badge.tone-violet { fill: var(--violet-line); }
.label.tone-violet { fill: var(--violet-ink); }
.box.tone-teal { fill: var(--teal-fill); stroke: var(--teal-line); stroke-width: 1.5; }
.badge.tone-teal { fill: var(--teal-line); }
.label.tone-teal { fill: var(--teal-ink); }
.box.tone-red { fill: var(--red-fill); stroke: var(--red-line); stroke-width: 1.5; }
.badge.tone-red { fill: var(--red-line); }
.label.tone-red { fill: var(--red-ink); }
.box.tone-amber { fill: var(--amber-fill); stroke: var(--amber-line); stroke-width: 1.5; }
.badge.tone-amber { fill: var(--amber-line); }
.label.tone-amber { fill: var(--amber-ink); }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
  <rect class="ground" x="-24" y="-24" width="928" height="356" rx="14" />
  <rect class="frame" x="0" y="0" width="880" height="308" rx="14" />
  <path class="edge" d="M 440 126 L 440 146 L 226 146 L 226 166" marker-end="url(#arrow)" />
  <path class="edge" d="M 440 126 L 440 146 L 654 146 L 654 166" marker-end="url(#arrow)" />
  <rect class="card highlight" x="20" y="20" width="840" height="106" rx="10" />
  <g class="icon" transform="translate(430 36) scale(0.8333)">
    <path d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878" />
  </g>
  <text class="title" x="280.1" y="81" text-anchor="start">OpenAI-compatible</text>
  <rect class="chip" x="429.5" y="65" width="170.4" height="20" rx="5" />
  <text class="code" x="436.5" y="79" text-anchor="start">louis-agent.core.openai</text>
  <text class="text" x="440" y="105" text-anchor="middle">The provider for any server that speaks OpenAI's chat API: LM Studio, vLLM, OpenAI itself.</text>
  <rect class="card" x="20" y="166" width="412" height="122" rx="10" />
  <g class="icon" transform="translate(36 182) scale(0.8333)">
    <path d="M3 4m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z" />
    <path d="M3 12m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z" />
    <path d="M7 8l0 .01" />
    <path d="M7 16l0 .01" />
  </g>
  <text class="title" x="36" y="227" text-anchor="start">Your endpoint</text>
  <text class="text" x="36" y="251" text-anchor="start">LLM_ENDPOINT is required. A server that wants no key</text>
  <text class="text" x="36" y="267" text-anchor="start">gets a placeholder.</text>
  <rect class="card" x="448" y="166" width="412" height="122" rx="10" />
  <g class="icon" transform="translate(464 182) scale(0.8333)">
    <path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
    <path d="M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
    <path d="M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
    <path d="M4 20h14" />
  </g>
  <text class="title" x="464" y="227" text-anchor="start">Standard usage</text>
  <text class="text" x="464" y="251" text-anchor="start">Tokens in the standard fields and no cache markers, so</text>
  <text class="text" x="464" y="267" text-anchor="start">the seam's defaults hold.</text>
</svg>
