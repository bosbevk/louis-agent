# Puls: the general assistant (chat only), its own stack beside the code-review app and the demo.
#   Start:  docker compose -f docker/docker-compose.puls.yml --env-file config/.env up -d --build
#   Stop:   docker compose -f docker/docker-compose.puls.yml --env-file config/.env stop
#   Remove: docker compose -f docker/docker-compose.puls.yml --env-file config/.env down
# Then open http://127.0.0.1:5070. Every chat loads only the agents toolset and hands each task to puls-agent, a
# specialist on the same image that loads just the toolsets the task needs (F5).
name: puls

x-puls-env: &puls-env
  env_file:
    - path: ../config/.env.${LLM_PROFILE:-anthropic}
    - path: ../config/.env
    - path: ../config/.env.secrets
      required: false

services:
  puls:
    build:
      context: ..
      dockerfile: docker/Dockerfile.puls
    image: louis-agent-puls:latest
    container_name: puls
    <<: *puls-env
    environment:
      WORKSPACE_ROOT: /workspace
      SKILLS_DIRECTORY: /skills
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "true"
      # Its own logs and usage ledger, apart from the code-review app's
      LOG_DIRECTORY: /logs
      PRICES_FILE: /workspace/config/prices.json
      RATES_FILE: /workspace/config/rates.json
      # Chats hand cooking to the specialist below and answer the web themselves (F29)
      AGENT_PEERS: puls=http://puls-agent:8080
      # Only a role that has passed its check is on (F29): the cook, its price minion (F30) and Puls's own voice. Set
      # PERSONALITIES_ENABLED in config/.env to change it (an empty value turns every role on), then `up -d`; both
      # containers read it.
      PERSONALITIES_ENABLED: ${PERSONALITIES_ENABLED-puls/voice-af,puls/voice-en,puls-cook,puls-minion-web-price-lookup}
    # Localhost only. Set AGENT_API_KEY in config/.env.secrets to require a key.
    ports:
      - "127.0.0.1:${PULS_PORT:-5070}:8080"
    volumes:
      - ${PULS_WORKSPACE:-../}:/workspace
      - ../Skills:/skills
      - ../logs/puls:/logs
    depends_on:
      - puls-agent

  # The specialist Puls delegates to: the same image; its one peer is itself, for the minions it hands pages to (F30).
  puls-agent:
    image: louis-agent-puls:latest
    container_name: puls_agent
    <<: *puls-env
    environment:
      WORKSPACE_ROOT: /workspace
      SKILLS_DIRECTORY: /skills
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "true"
      LOG_DIRECTORY: /logs
      PRICES_FILE: /workspace/config/prices.json
      RATES_FILE: /workspace/config/rates.json
      # Minions (F30) run on this instance itself, one level below the specialist that opened them: its only peer is
      # itself, and MINION_LLMS says which model a minion role runs on: this instance's own, Claude Haiku 5.5 (Louis,
      # 2026-10-17: qwen invented dates and priced the wrong products). Set MINION_LLMS in config/.env to change it.
      AGENT_PEERS: puls-agent=http://puls-agent:8080
      MINION_LLMS: ${MINION_LLMS-*=instance}
      PERSONALITIES_ENABLED: ${PERSONALITIES_ENABLED-puls/voice-af,puls/voice-en,puls-cook,puls-minion-web-price-lookup}
      # The models a specialist may run on besides Claude (F30): a sub-session naming "ollama-puls" runs on the local model
      # in config/.env.ollama-puls (Ollama on the host). Set LLM_SESSION_PROFILES in config/.env to change it.
      LLM_SESSION_PROFILES: ${LLM_SESSION_PROFILES-ollama-puls}
    ports:
      - "127.0.0.1:${PULS_CODER_PORT:-5071}:8080"
    volumes:
      - ${PULS_WORKSPACE:-../}:/workspace
      - ../Skills:/skills
      - ../logs/puls:/logs
