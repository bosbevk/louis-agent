name: louis-agent

services:
  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp-server
    container_name: rider_mcp_server
    env_file:
      # LLM settings: config/.env.anthropic or .env.ollama, chosen by LLM_PROFILE in config/.env
      - path: ../config/.env.${LLM_PROFILE:-anthropic}
      - path: ../config/.env
      - path: ../config/.env.secrets
        required: false
    environment:
      WORKSPACE_ROOT: /workspace
      # Skills and agent-built tools live in the repo, so anything created or approved in a container is kept
      SKILLS_DIRECTORY: /skills
      # The repo is a Windows checkout (CRLF); match Git for Windows so git in the container doesn't see every file as changed
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "true"
      # Run logs and oversized-tool-result records, kept on the host after --rm containers exit
      LOG_DIRECTORY: /logs
      # stdio (default): a local client launches this container and speaks over stdin/stdout, e.g. `docker compose run`.
      # http: serves Streamable HTTP instead, for a remote MCP client (an agent on another provider's SDK) - needs
      # MCP_API_KEY (falls back to AGENT_API_KEY) set in .env.secrets, since the same shell/git/file-write tools
      # are then reachable over the network.
      MCP_TRANSPORT: ${MCP_TRANSPORT:-stdio}
    ports:
      # No-op unless MCP_TRANSPORT=http. Bound to localhost by default, like the api service - only widen this
      # deliberately, and only with MCP_API_KEY (or AGENT_API_KEY) set.
      - "127.0.0.1:${MCP_PORT:-5090}:8080"
    volumes:
      - ../:/workspace
      - ../Skills:/skills
      - ../logs:/logs
      - ${REPOSITORIES_PATH}:/repositories
    stdin_open: true
    tty: true
    networks:
      - default

  acp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.acp-server
    image: louis-agent-acp:latest
    env_file:
      # LLM settings: config/.env.anthropic or .env.ollama, chosen by LLM_PROFILE in config/.env
      - path: ../config/.env.${LLM_PROFILE:-anthropic}
      - path: ../config/.env
      - path: ../config/.env.secrets
        required: false
    environment:
      WORKSPACE_ROOT: /workspace
      # Skills and agent-built tools live in the repo, so anything created or approved in a container is kept
      SKILLS_DIRECTORY: /skills
      # The repo is a Windows checkout (CRLF); match Git for Windows so git in the container doesn't see every file as changed
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "true"
      # Run logs and oversized-tool-result records, kept on the host after --rm containers exit
      LOG_DIRECTORY: /logs
      # The price table for the usage ledger's costs (the repository is mounted at /workspace)
      PRICES_FILE: /workspace/config/prices.json
      # Exchange rates' fallback when RATES_URL (Frankfurter by default) can't be reached (F14)
      RATES_FILE: /workspace/config/rates.json
    volumes:
      - ../:/workspace
      - ../Skills:/skills
      - ../logs:/logs
      - ${REPOSITORIES_PATH}:/repositories
    stdin_open: true
    networks:
      - default

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: louis-agent-api:latest
    container_name: louis_agent_api
    env_file:
      # LLM settings: config/.env.anthropic or .env.ollama, chosen by LLM_PROFILE in config/.env
      - path: ../config/.env.${LLM_PROFILE:-anthropic}
      - path: ../config/.env
      - path: ../config/.env.secrets
        required: false
    environment:
      WORKSPACE_ROOT: /workspace
      # Skills and agent-built tools live in the repo, so anything created or approved in a container is kept
      SKILLS_DIRECTORY: /skills
      # The repo is a Windows checkout (CRLF); match Git for Windows so git in the container doesn't see every file as changed
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "true"
      # Run logs and oversized-tool-result records, kept on the host after the container is removed
      LOG_DIRECTORY: /logs
      # The price table for the usage ledger's costs (the repository is mounted at /workspace)
      PRICES_FILE: /workspace/config/prices.json
      # Exchange rates' fallback when RATES_URL (Frankfurter by default) can't be reached (F14)
      RATES_FILE: /workspace/config/rates.json
      # Sub-sessions (F5): the peers StartSubSession may call, from config/.env; empty disables the agents toolset
      AGENT_PEERS: ${AGENT_PEERS:-}
    # Localhost only: the agent can run shell commands and write files. Set AGENT_API_KEY in .env.secrets to require a key.
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    volumes:
      - ../:/workspace
      - ../Skills:/skills
      - ../logs:/logs
      - ${REPOSITORIES_PATH}:/repositories
    networks:
      - default

  # A specialist on the same image (F5-S5): the api above opens sub-sessions on it with StartSubSession when
  # config/.env sets AGENT_PEERS=coder=http://api-coder:8080. Opt-in: docker compose ... --profile peers up -d api-coder.
  # It reads the same settings and key, and is bound to localhost like the api.
  api-coder:
    profiles: ["peers"]
    image: louis-agent-api:latest
    container_name: louis_agent_coder
    env_file:
      - path: ../config/.env.${LLM_PROFILE:-anthropic}
      - path: ../config/.env
      - path: ../config/.env.secrets
        required: false
    environment:
      WORKSPACE_ROOT: /workspace
      SKILLS_DIRECTORY: /skills
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "true"
      LOG_DIRECTORY: /logs
      PRICES_FILE: /workspace/config/prices.json
      RATES_FILE: /workspace/config/rates.json
      # A specialist never delegates further (its sub-sessions are depth 1, which refuses the agents toolset)
      AGENT_PEERS: ""
    ports:
      - "127.0.0.1:${CODER_PORT:-5081}:8080"
    volumes:
      - ../:/workspace
      - ../Skills:/skills
      - ../logs:/logs
      - ${REPOSITORIES_PATH}:/repositories
    networks:
      - default

  local-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: rider_csharp_agent
    env_file:
      # LLM settings: config/.env.anthropic or .env.ollama, chosen by LLM_PROFILE in config/.env
      - path: ../config/.env.${LLM_PROFILE:-anthropic}
      - path: ../config/.env
      - path: ../config/.env.secrets
        required: false
    environment:
      WORKSPACE_ROOT: /workspace
      # Skills and agent-built tools live in the repo, so anything created or approved in a container is kept
      SKILLS_DIRECTORY: /skills
      # The repo is a Windows checkout (CRLF); match Git for Windows so git in the container doesn't see every file as changed
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "true"
      # Run logs and oversized-tool-result records, kept on the host after --rm containers exit
      LOG_DIRECTORY: /logs
      # The price table for the usage ledger's costs (the repository is mounted at /workspace)
      PRICES_FILE: /workspace/config/prices.json
      # Exchange rates' fallback when RATES_URL (Frankfurter by default) can't be reached (F14)
      RATES_FILE: /workspace/config/rates.json
    volumes:
      - ../:/workspace
      - ../Skills:/skills
      - ../logs:/logs
      - ${REPOSITORIES_PATH}:/repositories
    stdin_open: true
    tty: true
    networks:
      - default

  ollama:
    build:
      context: ../services
      dockerfile: Dockerfile.ollama
    container_name: louis_ollama
    ports:
      - "11434:11434"
    # The entrypoint pulls LLM_MODEL from the Ollama profile on first start (OLLAMA_MODEL overrides it).
    env_file:
      - path: ../config/.env.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - default
    profiles:
      - ollama  # Only starts with: docker-compose --profile ollama up
    # Set LLM_PROFILE=ollama in config/.env, then:
    # docker compose -f docker/docker-compose.yml --env-file config/.env --profile ollama up -d ollama

  # The same Ollama on a GPU, sized for a 4 GB card (32k-token context, see their Dockerfiles). Run one of
  # ollama, ollama-nvidia and ollama-amd at a time: they share the port and the models volume.
  ollama-nvidia:
    build:
      context: ../services
      dockerfile: Dockerfile.ollama-nvidia
    container_name: louis_ollama_nvidia
    ports:
      - "11434:11434"
    env_file:
      - path: ../config/.env.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - default
    profiles:
      - ollama-nvidia
    # docker compose -f docker/docker-compose.yml --env-file config/.env --profile ollama-nvidia up -d ollama-nvidia

  ollama-amd:
    build:
      context: ../services
      dockerfile: Dockerfile.ollama-amd
    container_name: louis_ollama_amd
    ports:
      - "11434:11434"
    env_file:
      - path: ../config/.env.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    # ROCm reaches the GPU through these devices (Linux hosts only; Docker Desktop on Windows has no AMD passthrough).
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    networks:
      - default
    profiles:
      - ollama-amd
    # docker compose -f docker/docker-compose.yml --env-file config/.env --profile ollama-amd up -d ollama-amd

volumes:
  ollama_data:

networks:
  default:
    driver: bridge
