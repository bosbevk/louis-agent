<svg viewBox="-24 -24 928 550" width="928" height="550" role="img" aria-label="louis-agent.core at a glance" xmlns="http://www.w3.org/2000/svg">
  <title>louis-agent.core at a glance</title>
  <style>svg {
  --ground: #ffffff; --panel: #f6f7f8; --line: #d9dce0; --text: #15171a; --bright: #070708; --quiet: #5f656d; --chip: #eceef1; --accent: #3b6fc4; --tint: #eef3fc;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  svg { --ground: #070708; --panel: #1b1d21; --line: #2c2f35; --text: #e6e8eb; --bright: #ffffff; --quiet: #9aa0a8; --chip: #15171a; --accent: #7fa8e8; --tint: #141b28; }
}
.ground { fill: var(--ground); }
.box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.label { fill: var(--text); font: 600 12px var(--mono); }
.note { fill: var(--quiet); font: 10px var(--mono); }
.edge { fill: none; stroke: var(--quiet); stroke-width: 1.5; }
.arrow { fill: var(--quiet); }
.dashed { stroke-dasharray: 5 4; }
.group { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.group-label {
  fill: var(--quiet); font: 600 10px var(--mono); letter-spacing: 1px; text-transform: uppercase;
}
.word {
  fill: var(--text); font: 600 10px var(--mono); letter-spacing: 1px; text-transform: uppercase;
  paint-order: stroke; stroke: var(--ground); stroke-width: 5px; stroke-linejoin: round;
}
.caption {
  fill: var(--quiet); font: 600 10.5px var(--mono); letter-spacing: 1.4px; text-transform: uppercase;
}
.icon { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.frame { fill: none; stroke: var(--line); stroke-width: 1; }
.card { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.highlight { fill: var(--tint); stroke: var(--accent); }
.title { fill: var(--text); font: 600 13px var(--mono); }
.chip { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.code { fill: var(--text); font: 11px var(--mono); }
.text { fill: var(--quiet); font: 11px var(--mono); }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
  <rect class="ground" x="-24" y="-24" width="928" height="550" rx="14" />
  <rect class="frame" x="0" y="0" width="880" height="502" rx="14" />
  <path class="edge" d="M 440 126 L 440 146 L 154.7 146 L 154.7 166" marker-end="url(#arrow)" />
  <path class="edge" d="M 440 126 L 440 166" marker-end="url(#arrow)" />
  <path class="edge" d="M 440 126 L 440 146 L 725.3 146 L 725.3 166" marker-end="url(#arrow)" />
  <rect class="card highlight" x="20" y="20" width="840" height="106" rx="10" />
  <g class="icon" transform="translate(430 36) scale(0.8333)">
    <path d="M5 5m0 1a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1z" />
    <path d="M9 9h6v6h-6z" />
    <path d="M3 10h2" />
    <path d="M3 14h2" />
    <path d="M10 3v2" />
    <path d="M14 3v2" />
    <path d="M21 10h-2" />
    <path d="M21 14h-2" />
    <path d="M14 21v-2" />
    <path d="M10 21v-2" />
  </g>
  <text class="title" x="332.6" y="81" text-anchor="start">The engine</text>
  <rect class="chip" x="424.6" y="65" width="122.8" height="20" rx="5" />
  <text class="code" x="431.6" y="79" text-anchor="start">louis-agent.core</text>
  <text class="text" x="440" y="105" text-anchor="middle">Everything that makes an agent an agent, whichever host you talk to it through.</text>
  <rect class="card" x="20" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(36 182) scale(0.8333)">
    <path d="M8 9h8" />
    <path d="M8 13h6" />
    <path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z" />
  </g>
  <text class="title" x="36" y="227" text-anchor="start">The loop</text>
  <text class="text" x="36" y="251" text-anchor="start">Sends the history and the tools to</text>
  <text class="text" x="36" y="267" text-anchor="start">the model and runs its tool calls,</text>
  <text class="text" x="36" y="283" text-anchor="start">up to ten rounds a message.</text>
  <rect class="card" x="305.3" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(321.3 182) scale(0.8333)">
    <path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3" />
  </g>
  <text class="title" x="321.3" y="227" text-anchor="start">Guards</text>
  <text class="text" x="321.3" y="251" text-anchor="start">Oversized results summarised,</text>
  <text class="text" x="321.3" y="267" text-anchor="start">cut-off calls never run, a failure</text>
  <text class="text" x="321.3" y="283" text-anchor="start">sent back with its reason.</text>
  <rect class="card" x="590.7" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(606.7 182) scale(0.8333)">
    <path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
    <path d="M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
    <path d="M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
    <path d="M4 20h14" />
  </g>
  <text class="title" x="606.7" y="227" text-anchor="start">Usage</text>
  <text class="text" x="606.7" y="251" text-anchor="start">One ledger line per model request:</text>
  <text class="text" x="606.7" y="267" text-anchor="start">its tokens, model and time, priced</text>
  <text class="text" x="606.7" y="283" text-anchor="start">by a dated table.</text>
  <rect class="card" x="20" y="344" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(36 360) scale(0.8333)">
    <path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
    <path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
    <path d="M3 6l0 13" />
    <path d="M12 6l0 13" />
    <path d="M21 6l0 13" />
  </g>
  <text class="title" x="36" y="405" text-anchor="start">Skills and prompts</text>
  <text class="text" x="36" y="429" text-anchor="start">Prompts embedded by level with the</text>
  <text class="text" x="36" y="445" text-anchor="start">principles first, and the skills</text>
  <text class="text" x="36" y="461" text-anchor="start">an agent writes.</text>
  <rect class="card" x="305.3" y="344" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(321.3 360) scale(0.8333)">
    <path d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878" />
  </g>
  <text class="title" x="321.3" y="405" text-anchor="start">Providers</text>
  <text class="text" x="321.3" y="429" text-anchor="start">One chat client behind a seam.</text>
  <text class="text" x="321.3" y="445" text-anchor="start">Each model's SDK comes as its own</text>
  <text class="text" x="321.3" y="461" text-anchor="start">small library.</text>
  <rect class="card" x="590.7" y="344" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(606.7 360) scale(0.8333)">
    <path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" />
    <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
  </g>
  <text class="title" x="606.7" y="405" text-anchor="start">Bootstrap</text>
  <text class="text" x="606.7" y="429" text-anchor="start">AgentHost reads the settings,</text>
  <text class="text" x="606.7" y="445" text-anchor="start">loads the skills and the client,</text>
  <text class="text" x="606.7" y="461" text-anchor="start">and builds the engine.</text>
</svg>
