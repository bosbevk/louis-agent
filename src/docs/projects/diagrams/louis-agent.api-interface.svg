  <text class="notes" x="38" y="690">
    <tspan class="note-head">Sessions over HTTP:</tspan>
    <tspan class="note-rest">a program adds the API with the host's context, a session per conversation streams its turn in a format it picks, and the open door counts the public's.</tspan>
