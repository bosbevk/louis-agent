# Puls's public placeholder on mypuls.co.za (F58), served from this PC through a Cloudflare Tunnel. Its own container
# group, apart from Puls's dev stack. Only the static page is public: Puls's chat spends the API key and has no accounts
# or rate limits yet (F43, F42), so the app, its agent and Mongo are on no network the tunnel reaches.
#
#   docker compose -f demos/puls/docker/docker-compose.public.yml --env-file demos/puls/config/.env.secrets up -d --build
#
# The secrets file is read only to fill PULS_TUNNEL_TOKEN below; no other key reaches a container.
name: mypuls-production

services:
  puls-placeholder:
    build:
      context: ../../..
      dockerfile: demos/puls/docker/images/Dockerfile.puls-placeholder
    image: puls-placeholder:latest
    restart: unless-stopped
    # Localhost only, to check the page on this PC before it goes out (http://localhost:5061).
    ports:
      - "127.0.0.1:${PULS_PLACEHOLDER_PORT:-5061}:80"
    networks:
      - public

  cloudflared:
    # Dials out to Cloudflare, so no port opens on the router. Cloudflare's dashboard maps mypuls.co.za and
    # www.mypuls.co.za to http://puls-placeholder:80 (the tunnel's public hostnames).
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      # cloudflared reads its token from this variable, so it never shows on a command line.
      TUNNEL_TOKEN: ${PULS_TUNNEL_TOKEN:?set PULS_TUNNEL_TOKEN in demos/puls/config/.env.secrets}
    depends_on:
      puls-placeholder:
        condition: service_healthy
    networks:
      - public

networks:
  public: {}
