      <text class="mrq-code" x="448" y="124" text-anchor="middle">approved 2026-10-15</text>
      <text class="crd-summary" x="448" y="160" text-anchor="middle">The note travels in AskAgent's message: no tool change, no engine change, no sentiment model.</text>
