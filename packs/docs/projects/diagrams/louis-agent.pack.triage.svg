    <path d="M7 8l0 8" />
    <path d="M9 18h6a2 2 0 0 0 2 -2v-5" />
    <path d="M14 14l3 -3l3 3" />
  </g>
  <text class="title" x="321.3" y="227" text-anchor="start">A run's steps</text>
  <text class="text" x="321.3" y="251" text-anchor="start">Who did what and why, in order,</text>
  <text class="text" x="321.3" y="267" text-anchor="start">with a typed record behind each</text>
  <text class="text" x="321.3" y="283" text-anchor="start">decision.</text>
  <rect class="card" x="590.7" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(606.7 182) scale(0.8333)">
    <path d="M8 9h8" />
    <path d="M8 13h6" />
    <path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z" />
  </g>
  <text class="title" x="606.7" y="227" text-anchor="start">Typed endings</text>
  <text class="text" x="606.7" y="251" text-anchor="start">An investigation, a review and a</text>
  <text class="text" x="606.7" y="267" text-anchor="start">case decision, each value parsed</text>
  <text class="text" x="606.7" y="283" text-anchor="start">and checked.</text>
  <rect class="card" x="20" y="344" width="412" height="122" rx="10" />
  <g class="icon" transform="translate(36 360) scale(0.8333)">
