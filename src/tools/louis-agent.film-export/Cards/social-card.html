<!doctype html>
<!-- The share card (FX174): louis-agent's name with the glass orb as its o, the one ball on the card, in a violet
     light, then the site's slogan and its address, at 1200 by 630, the size a link preview asks for. The orb is a
     photograph of the site's own, put in for {orb}; the card's ground, light or dark, is the class put in for {look}.
     The type is Geist, loaded as the site loads it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;650&family=Geist+Mono:wght@400;600&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: "Geist", system-ui, sans-serif; }
  body.dark {
    color: #ffffff;
    background: radial-gradient(620px 520px at 78% 40%, rgba(107, 77, 255, .42), rgba(107, 77, 255, 0) 70%),
      radial-gradient(900px 600px at 100% 0%, rgba(146, 130, 255, .18), rgba(0, 0, 0, 0) 60%), #050506;
  }
  body.light {
    color: #0b0b0e;
    background: radial-gradient(620px 520px at 78% 40%, rgba(107, 77, 255, .26), rgba(107, 77, 255, 0) 70%),
      radial-gradient(900px 600px at 0% 100%, rgba(226, 223, 255, .9), rgba(226, 223, 255, 0) 60%), #f4f2fb;
  }
  .name { position: absolute; left: 96px; top: 120px; display: flex; align-items: center; font-weight: 650;
    font-size: 132px; letter-spacing: -.045em; line-height: 1; }
  .name img { width: .86em; height: .86em; margin: .06em .02em 0; }
  /* The photograph is taken in a square frame; only the round orb and its ring are kept. */
  .name img { clip-path: circle(48%); }
  .line { position: absolute; left: 96px; top: 330px; margin: 0; font-weight: 500; font-size: 64px;
    letter-spacing: -.02em; }
  .dark .line { color: #ecebf5; }
  .light .line { color: #1d1b26; }
  .foot { position: absolute; left: 96px; top: 530px; margin: 0; font-family: "Geist Mono", monospace; font-size: 28px; }
  .dark .foot { color: #9b97b3; }
  .light .foot { color: #5d5a6b; }
</style>
</head>
<body class="{look}">
  <div class="name">l<img src="{orb}" alt="">uis-agent</div>
  <p class="line">The website that answers.</p>
  <p class="foot">louis-agent.dev</p>
</body>
</html>
