}
.pic-name { fill: var(--text); font: 600 15px var(--pic-sans); }
.pic-note { fill: var(--quiet); font: 11.5px var(--pic-sans); }
.pic-word { fill: var(--quiet); font: 500 10px var(--mono); }
.pic-port { fill: var(--ground); stroke-width: 1.25; }
