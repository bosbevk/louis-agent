<script type=application/ld+json>{
    "@context": "http://schema.org",
    "@type": "Recipe",
    "name": "Bobotie Filo Parcels",
    "author": {
        "@type": "Person",
        "name": "Dianne Bibby"
    },
    "datePublished": "2015-05-25T07:00:26",
    "keywords": "Best Bobotie recipe, Bibbys Kitchen recipes, Traditional South African recipes, Cape Malay Food,",
    "recipeCategory": "Dinner,",
    "recipeCuisine": "South African",
    "prepTime": "PT20M",
    "cookTime": "PT1H",
    "description": "These Bobotie filo parcels are my interpretation of a South African classic, with a slightly modern spin. This family favourite is often served with sliced bananas, desiccated coconut and Mrs Ball&#039;s chutney on the side,\u00a0 which is how I remember it growing up. Bobotie was introduced to South Africa by colonists from the Dutch East India Company with the first recorded recipe dating back to 1609. ",
    "image": "https://www.bibbyskitchenat36.com/wp-content/uploads/2024/09/DSC_9521.jpg",
    "recipeIngredient": [
        "2 slices white bread, crusts removed and soaked in 200ml milk",
        "2 tablespoons golden sultanas",
        "juice of half an orange",
        "2 tablespoons vegetable oil",
        "a knob of butter",
        "1 large brown onion, finely diced",
        "2 garlic cloves, minced",
        "1 carrot, finely diced or grated",
        "2 teaspoons freshly grated ginger",
        "2 1/2 teaspoons medium strength curry powder",
        "1/4 teaspoon dried red chilli flakes",
        "1 teaspoon ground coriander",
        "1 teaspoon turmeric",
        "zest of 1 lemon and juice of half",
        "500g free-range lean beef mince",
        "2 cinnamon sticks",
        "1 tablespoon Mrs Ball&#039;s chutney",
        "1 cup chicken stock",
        "2 tablespoons almond nibs",
        "6 sheets filo pastry",
        "4 tablespoons melted butter",
        "egg wash (1 egg whisked with 2 tablespoons water)",
        "sesame seeds, for finishing",
        ""
    ],
    "interactionStatistic": {
        "@type": "InteractionCounter",
        "interactionType": "http://schema.org/Comment",
        "userInteractionCount": "1"
    },
    "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": 5,
        "reviewCount": 1,
        "bestRating": 5,
        "worstRating": 5
    },
    "recipeInstructions": [
        {
            "@type": "HowToStep",
            "name": "Soak the sultanas",
            "text": "Place the sultanas in a small bowl, cover with the orange juice and set aside.\r\n\r\n"
        },
        {
            "@type": "HowToStep",
            "name": "Saute the onion",
            "text": "Heat the oil and butter in a large frying pan. Saut\u00e9 the onion until soft and translucent. Add the garlic, carrot and ginger. Cook for a further 4 minutes.\r\n\r\n"
        },
        {
            "@type": "HowToStep",
            "name": "Cook the mince",
            "text": "Add the mince and cook until nicely browned and just starting to catch on the bottom of the pan. Season with 1 teaspoon salt and freshly ground black pepper. mix\u00a0 in all the spices stirring to coat the meat and bloom the spice, about a minute or two.\r\n\r\n"
        },
        {
            "@type": "HowToStep",
            "name": "Simmer the sauce",
            "text": "Stir in the milk-soaked bread, along with the milk, drained sultanas, cinnamon, chutney, stock and almond flour. Cover partially with a lid and simmer for 20 minutes, or until the carrots are soft and the meat is cooked through.\r\n\r\n"
        },
        {
            "@type": "HowToStep",
            "name": "Fill the filo pastry",
            "text": "Cut each filo sheet in half, trimming the edges to form 18 equal squares. Brush each pastry sheet lightly with melted butter, layering 3 sheets atop the other until you have 6 equal stacks. Divide the meat equally between the each filo stack. Gather the pastry edges towards the centre and press firmly together to form a parcel.\r\n\r\n"
        },
        {
            "@type": "HowToStep",
            "name": "Brush with egg wash and bake the pastry",
            "text": "Brush with egg wash and scatter over some sesame seeds. Bake for 35-40 minutes until golden and crisp.carrots are soft and the meat is cooked through.\r\n\r\n"
        }
    ],
    "recipeYield": 6
}</script>
