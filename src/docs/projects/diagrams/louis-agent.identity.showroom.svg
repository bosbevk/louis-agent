    <path d="M12.5 3a17 17 0 0 1 0 18" />
  </g>
  <text class="title" x="36" y="227" text-anchor="start">A guesthouse</text>
  <text class="text" x="36" y="251" text-anchor="start">Seemeeu, in Yzerfontein. Never</text>
  <text class="text" x="36" y="267" text-anchor="start">promises a room it can't see.</text>
  <rect class="card" x="305.3" y="166" width="269.3" height="122" rx="10" />
