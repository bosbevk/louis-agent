<text class="key" x="560" y="140">The violet line's upright piece runs</text>
<text class="key" x="560" y="158">past the green one's. On one track</text>
<text class="key" x="560" y="176">they would lie on one another, so</text>
<text class="key" x="560" y="194">the green one turns a step earlier,</text>
<text class="key" x="560" y="212">and the two cross once.</text></svg>
