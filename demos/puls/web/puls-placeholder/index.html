<!doctype html>
<!-- F58: the public placeholder on mypuls.co.za. A static copy of the landing page's look, nothing more: no script, no
     form, no link into the app (PlaceholderPageTests), because Puls's chat spends the API key and has no accounts or
     rate limits yet (F43, F42). Served by Dockerfile.puls-placeholder. -->
<html lang="af">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puls: binnekort</title>
  <meta name="description" content="Puls: plaaslike kenners vir jou dorp, in een gesprek. Binnekort.">
  <style>
    :root { --bg: #0b0e0d; --ink: #efefeb; --muted: #a9b0ab; --green: #6fd87c; --orange: #f58220; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(120% 80% at 50% 110%, #1f4a30 0%, #101a14 45%, var(--bg) 75%);
      color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    main { max-width: 34rem; }
    .logo { width: min(260px, 70vw); height: auto; margin-bottom: 2rem; }
    h1 { font-size: clamp(1.8rem, 6vw, 2.8rem); line-height: 1.15; letter-spacing: -0.01em; }
    p { color: var(--muted); font-size: 1.1rem; line-height: 1.6; margin-top: 1rem; }
    .soon {
      display: inline-block; margin-top: 2rem; padding: .5rem 1.1rem; border-radius: 999px;
      border: 1px solid var(--orange); color: var(--orange); font-weight: 600; letter-spacing: .04em;
    }
    footer { margin-top: 3rem; font-size: .85rem; color: var(--muted); }
    footer a { color: var(--green); }
  </style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 300 120" role="img" aria-label="Puls">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7952f"/><stop offset="1" stop-color="#d9660b"/></linearGradient>
      <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
        <circle cx="60" cy="60" r="58" fill="#fff"/>
        <circle cx="30" cy="92" r="19.5" fill="none" stroke="#000" stroke-width="28"/>
        <circle cx="30" cy="92" r="41.5" fill="none" stroke="#000" stroke-width="9"/>
        <circle cx="30" cy="92" r="53.3" fill="none" stroke="#000" stroke-width="7.6"/>
        <circle cx="30" cy="92" r="63.75" fill="none" stroke="#000" stroke-width="6.3"/>
        <circle cx="30" cy="92" r="72.95" fill="none" stroke="#000" stroke-width="5.1"/>
        <circle cx="30" cy="92" r="81" fill="none" stroke="#000" stroke-width="4"/>
        <circle cx="30" cy="92" r="88" fill="none" stroke="#000" stroke-width="3"/>
      </mask>
    </defs>
    <rect width="120" height="120" fill="url(#bg)" mask="url(#cut)"/>
    <circle cx="30" cy="92" r="7.5" fill="#efefeb"/>
    <g transform="translate(140 19) scale(.9)">
      <path d="M14 26V84M14 44a18 18 0 1 0 36 0a18 18 0 1 0-36 0M64 26v18a18 18 0 0 0 36 0M100 26v36M118 8v54M163 31c-4-4-9-5-13-5c-8 0-13 4-13 9c0 6 6 8 13 9c8 1 14 3 14 9c0 6-6 9-14 9c-6 0-11-2-15-6"
            fill="none" stroke="#f58220" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </svg>
  <h1>Elke vraag op pad na 'n antwoord</h1>
  <p>Plaaslike kenners vir jou dorp, in een gesprek: die kok, die tuinier, die weerman en nog baie meer.</p>
  <span class="soon">Binnekort</span>
  <footer>Gebou op <a href="https://louis-agent.dev">louis-agent</a></footer>
</main>
</body>
</html>
