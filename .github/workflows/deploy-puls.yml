# Deploys Puls and the louis-agent demo's app to Azure (F109.5, F109.2): the same `deploy.ps1 release` Louis runs on
# his PC, from GitHub, so a merge reaches mypuls.co.za and louis-agent.dev without anyone's machine. By itself on the
# merge (the push to main; CI ran on the pull request, FX93), and any time from the Actions tab's "Run workflow"
# button. Each app is released even when the other's release failed: they are two apps on one
# environment, and one's bad day is not the other's. The how-to, Louis's one-time Azure setup and the roll-back are in
# demos/puls/deploy/azure/README.md, "Deploying from GitHub"; the why in ADR 0097.
name: Deploy the apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# OpenID Connect: GitHub signs a short-lived token for this run, Azure trusts it for this repo's main branch only and
# swaps it for an Azure token. No password is stored anywhere; the three ids below are repository variables.
permissions:
  id-token: write
  contents: read

# One deploy at a time: a second waits for the first, never stops it half-way through a revision.
concurrency:
  group: deploy-the-apps
  cancel-in-progress: false

jobs:
  release:
    # The push is main's (the trigger names it); the button runs from main, the only branch the federated credential trusts.
    runs-on: ubuntu-latest
    steps:
      - name: Check the Azure ids are set
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          [ -n "$AZURE_CLIENT_ID" ] || missing="$missing AZURE_CLIENT_ID"
          [ -n "$AZURE_TENANT_ID" ] || missing="$missing AZURE_TENANT_ID"
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          if [ -n "$missing" ]; then
            echo "::error::Set the repository variables$missing (Settings, Secrets and variables, Actions, Variables); the setup is in demos/puls/deploy/azure/README.md, 'Deploying from GitHub'."
            exit 1
          fi

      # The commit CI passed, not whatever main holds by now; the button deploys main as it is.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The images build in the registry (az acr build), so the runner needs no Docker; each revision is the next one.
      - name: Release Puls
        shell: pwsh
        run: ./demos/puls/deploy/azure/deploy.ps1 release -App puls-app

      - name: Release the louis-agent app
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./demos/puls/deploy/azure/deploy.ps1 release -App louis-agent-app

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy the apps"
            echo "Commit: \`$(git rev-parse --short HEAD)\`"
            echo "Running revisions of puls-app:"
            echo '```'
            az containerapp revision list -n puls-app -g rg-puls-za --query "[?properties.active].{revision:name, healthy:properties.healthState, created:properties.createdTime}" -o table || true
            echo '```'
            echo "Running revisions of louis-agent-app:"
            echo '```'
            az containerapp revision list -n louis-agent-app -g rg-puls-za --query "[?properties.active].{revision:name, healthy:properties.healthState, created:properties.createdTime}" -o table || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
