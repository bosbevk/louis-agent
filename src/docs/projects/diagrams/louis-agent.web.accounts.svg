  <text class="title" x="321.3" y="227" text-anchor="start">The client</text>
  <text class="text" x="321.3" y="251" text-anchor="start">Talks to the API's /account</text>
  <text class="text" x="321.3" y="267" text-anchor="start">routes, Identity's and ours.</text>
  <rect class="card" x="590.7" y="166" width="269.3" height="138" rx="10" />
