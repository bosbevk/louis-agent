  <text class="word tone-violet" x="521.8" y="219.5" text-anchor="middle">3</text>
  <path class="edge tone-violet" d="M 521.8 288 L 549.8 288 L 549.8 304 L 523.8 304" marker-end="url(#arrow-violet)" />
