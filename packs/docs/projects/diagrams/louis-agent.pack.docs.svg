    <path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
    <path d="M3 6l0 13" />
    <path d="M12 6l0 13" />
    <path d="M21 6l0 13" />
  </g>
  <text class="title" x="323.8" y="81" text-anchor="start">The docs</text>
  <rect class="chip" x="399.4" y="65" width="156.8" height="20" rx="5" />
  <text class="code" x="406.4" y="79" text-anchor="start">louis-agent.pack.docs</text>
  <text class="text" x="440" y="105" text-anchor="middle">Three read-only tools over one folder of markdown, so an answer can name its doc.</text>
  <rect class="card" x="20" y="166" width="269.3" height="122" rx="10" />
  <g class="icon" transform="translate(36 182) scale(0.8333)">
    <path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2" />
  </g>
  <text class="title" x="36" y="227" text-anchor="start">ListDocs</text>
  <text class="text" x="36" y="251" text-anchor="start">The folders and docs in one</text>
  <text class="text" x="36" y="267" text-anchor="start">folder, folders first.</text>
  <rect class="card" x="305.3" y="166" width="269.3" height="122" rx="10" />
  <g class="icon" transform="translate(321.3 182) scale(0.8333)">
    <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
    <path d="M21 21l-6 -6" />
  </g>
  <text class="title" x="321.3" y="227" text-anchor="start">SearchDocs</text>
  <text class="text" x="321.3" y="251" text-anchor="start">Every line holding the text, as</text>
  <text class="text" x="321.3" y="267" text-anchor="start">its path and line.</text>
  <rect class="card" x="590.7" y="166" width="269.3" height="122" rx="10" />
  <g class="icon" transform="translate(606.7 182) scale(0.8333)">
    <path d="M14 3v4a1 1 0 0 0 1 1h4" />
    <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" />
    <path d="M9 9l1 0" />
    <path d="M9 13l6 0" />
    <path d="M9 17l6 0" />
  </g>
  <text class="title" x="606.7" y="227" text-anchor="start">ReadDoc</text>
  <text class="text" x="606.7" y="251" text-anchor="start">One doc whole, markdown or plain</text>
  <text class="text" x="606.7" y="267" text-anchor="start">text.</text>
</svg>
