<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Louis Agent · the coding agent</title>
    <!-- The link card (SiteLinkCardTests): what a chat or a social site shows for a link here. This app runs on the PC
         beside the coding agent; the framework's own site (src/site) is louis-agent.dev, so the card points there. -->
    <meta name="description" content="The coding agent's chat on the louis-agent framework: it reads, edits and tests code in the workspace, and every turn shows its bill." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="louis-agent" />
    <meta property="og:title" content="Louis Agent · the coding agent" />
    <meta property="og:description" content="The coding agent's chat on the louis-agent framework." />
    <meta property="og:url" content="https://louis-agent.dev/coding-agent" />
    <meta property="og:image" content="https://louis-agent.dev/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <base href="/" />
    <!-- Retro terminal fonts; the CSS falls back to the system monospace font if they can't load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500&family=IBM+Plex+Mono:wght@400;600&family=VT323&display=swap" />
    <!-- Bootstrap 5.3 for the responsive offcanvas sidebar and breakpoints; loaded before app.css so our styles win. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- The components' own styles (CL58), bundled by the build from every X.razor.scss, after app.css so they win. -->
    <link rel="stylesheet" href="louis-agent.code-review.styles.css" />
    <!-- The active theme (css/themes/<id>.css, listed in themes.json). The saved choice is applied before the app starts so
         the page never flashes the default; the id is checked so storage can only ever pick a file from that folder. -->
    <link id="theme-css" rel="stylesheet" href="css/themes/console.css" />
    <script>
        try {
            const theme = localStorage.getItem("louis-agent.theme");
            if (theme && /^[a-z0-9-]+$/.test(theme)) {
                document.getElementById("theme-css").href = "css/themes/" + theme + ".css";
                document.documentElement.dataset.theme = theme;
            }
        } catch { }
    </script>
    <script src="_content/louis-agent.web/js/first-paint.js"></script>
</head>

<body>
    <div id="app">
        <div class="loading">BOOTING LOUIS AGENT<span class="cursor"></span></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Syntax highlighting (file viewer and chat code blocks): pinned version with integrity hashes; its colours come from app.css. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"
            integrity="sha512-VSPLUv/n1Bmn+4zoxBNwpuFAO3//79I0Aax/qHDx24R47vylPcc9PrHDCqlePwHnh3joiM7/YTQhcXyQAAxvPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/languages/powershell.min.js"
            integrity="sha512-I2sYcyooqG4MUbNURH1azVlcuwqA4uxCFT9tLOXIhrvwrosPpNrE0Zz0AYdjRaGPacIrJTwnTut5CzB6VNc6Hw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/languages/dockerfile.min.js"
            integrity="sha512-h1yykn3jz+UWHMFSt9H1vNOT8fgC1i7uYBpAckqwcuhoWL16s9Xzsja7blR8SXEul1dOc6kc7AFGuEFfEyk9cw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/theme.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
