rch the</text><text x="50.0" y="352.0" text-anchor="start" style="fill:#9aa3b5;font:12px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">workspace. PDF, Word and</text><text x="50.0" y="370.0" text-anchor="start" style="fill:#9aa3b5;font:12px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">Excel as text.</text><rect x="261.5" y="258" width="207.5" height="132" rx="14" fill="url(#generalpacksglass)" stroke="#ffffff" stroke-opacity=".10"/><rect x="289.5" y="257.5" width="151.5" height="1.6" fill="url(#generalpacksedge)"/><rect x="279.5" y="276" width="34" height="34" rx="10" fill="#8f7dff" fill-opacity=".16"/><g transform="translate(287.5 284.0) scale(0.7500)" fill="none" stroke="#cfc8ff" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M7 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M7 8l0 8"/><path d="M9 18h6a2 2 0 0 0 2 -2v-5"/><path d="M14 14l3 -3l3 3"/></g><text x="325.5" y="299.0" text-anchor="start" style="fill:#f3f4f8;font:600 15px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">Git</text><text x="279.5" y="334.0" text-anchor="start" style="fill:#9aa3b5;font:12px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">Status, diffs, branches,</text><text x="279.5" y="352.0" text-anchor="start" style="fill:#9aa3b5;font:12px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">commits, merges and history.</text><rect x="491.0" y="258" width="207.5" height="132" rx="14" fill="url(#generalpacksglass)" stroke="#ffffff" stroke-opacity=".10"/><rect x="519.0" y="257.5" width="151.5" height="1.6" fill="url(#generalpacksedge)"/><rect x="509.0" y="276" width="34" height="34" rx="10" fill="#8f7dff" fill-opacity=".16"/><g transform="translate(517.0 284.0) scale(0.7500)" fill="none" st