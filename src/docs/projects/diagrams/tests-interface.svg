.badge.tone-teal, .arrow.tone-teal { fill: var(--teal-line); }
.label.tone-teal, .word.tone-teal { fill: var(--teal-ink); }
.edge.tone-teal, .word-chip.tone-teal { stroke: var(--teal-line); }
.box.tone-red { fill: var(--red-fill); stroke: var(--red-line); stroke-width: 1.5; }
.badge.tone-red, .arrow.tone-red { fill: var(--red-line); }
.label.tone-red, .word.tone-red { fill: var(--red-ink); }
.edge.tone-red, .word-chip.tone-red { stroke: var(--red-line); }
.box.tone-amber { fill: var(--amber-fill); stroke: var(--amber-line); stroke-width: 1.5; }
.badge.tone-amber, .arrow.tone-amber { fill: var(--amber-line); }
.label.tone-amber, .word.tone-amber { fill: var(--amber-ink); }
.edge.tone-amber, .word-chip.tone-amber { stroke: var(--amber-line); }
svg {
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --banner: #1f3a68; --banner-line: #5b77a6; --banner-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
