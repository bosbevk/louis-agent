    <path d="M4 8h16" />
    <path d="M8 4v4" />
  </g>
  <text class="title" x="36" y="227" text-anchor="start">The pages</text>
  <text class="text" x="36" y="251" text-anchor="start">Sign-in, registration,</text>
  <text class="text" x="36" y="267" text-anchor="start">confirmation, reset and profile,</text>
  <text class="text" x="36" y="283" text-anchor="start">inside the site's own layout.</text>
