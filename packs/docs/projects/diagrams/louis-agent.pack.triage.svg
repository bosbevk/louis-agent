  <text class="title" x="325.2" y="81" text-anchor="start">Triage</text>
  <rect class="chip" x="384.4" y="65" width="170.4" height="20" rx="5" />
  <text class="code" x="391.4" y="79" text-anchor="start">louis-agent.pack.triage</text>
  <text class="text" x="440" y="105" text-anchor="middle">What an agent team needs to triage a service's errors, so its identities stay markdown.</text>
  <rect class="card" x="20" y="166" width="269.3" height="138" rx="10" />
  <g class="icon" transform="translate(36 182) scale(0.8333)">
