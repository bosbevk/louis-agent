.flow-shape.tone-violet { --flow-glow: var(--violet-line); }
.flow-shape.tone-teal { --flow-glow: var(--teal-line); }
.flow-shape.tone-red { --flow-glow: var(--red-line); }
.flow-shape.tone-amber { --flow-glow: var(--amber-line); }
.flow-chip { fill: var(--ground); stroke-width: 1; stroke-opacity: .6; }
.flow-word { font: 500 10px var(--mono); }</style>
