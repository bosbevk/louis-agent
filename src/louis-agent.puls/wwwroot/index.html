<!DOCTYPE html>
<html lang="af" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16191b" />
    <title>Puls</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="brand/puls-mark.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <!-- Montserrat for text, JetBrains Mono for code; both fall back to the system fonts if they can't load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
    <!-- Bootstrap 5.3 for the responsive offcanvas sidebar and breakpoints; loaded before app.css so Puls's styles win. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        // The sidebar's saved width, and whether it or the Werk panel is hidden: applied before the app paints so nothing jumps.
        try {
            const width = parseInt(localStorage.getItem("puls.sidebarWidth"), 10);
            if (width >= 220 && width <= 480) document.documentElement.style.setProperty("--sidebar-w", width + "px");
            if (localStorage.getItem("puls.sidebarHidden") === "1") document.documentElement.classList.add("sidebar-hidden");
            if (localStorage.getItem("puls.workHidden") === "1") document.documentElement.classList.add("work-hidden");
            // Motion switched on by the user although the system asks for less (F24): applied before the first paint.
            if (localStorage.getItem("puls.motion") === "on") document.documentElement.dataset.motion = "on";
        } catch { }
    </script>
</head>

<body>
    <div id="app">
        <!-- The start screen (F24): the mark beats while the runtime's files load; the count is Blazor's own progress
             (it sets --blazor-load-percentage-text on <html> as each file arrives), so it is real, not a timer. -->
        <div class="loading" role="status" aria-live="polite">
            <img class="loading-mark" src="brand/puls-icon-tile.svg" alt="" width="72" height="72" />
            <img src="brand/puls-logo-white.svg" alt="Puls" width="96" />
            <b class="loading-pct" aria-hidden="true"></b>
        </div>
    </div>

    <div id="blazor-error-ui">
        Iets het skeefgeloop.
        <a href="." class="reload">Herlaai</a>
        <span class="dismiss">×</span>
    </div>
    <!-- Syntax highlighting for code blocks in answers: pinned version with integrity hashes; its colours come from app.css. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"
            integrity="sha512-VSPLUv/n1Bmn+4zoxBNwpuFAO3//79I0Aax/qHDx24R47vylPcc9PrHDCqlePwHnh3joiM7/YTQhcXyQAAxvPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/chat.js"></script>
    <script src="js/landing.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
